<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE840">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coop SG">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icona-192.png">
<link rel="manifest" href="manifest.json">
<title>Coop San Giovanni</title>

<!--
  COOPERATIVA SAN GIOVANNI — la home dell'app (versione 16)

  E' la pagina che si apre dal link personale e dall'icona sulla Home.
  Mostra il logo e le parti dell'app che quella persona puo' usare:
    Timbra        se il link contiene il codice timbrature (d=)
    Ore del mese  se contiene il codice ore (o=); per chi lavora a chiamata
                  diventa "Interventi"
    Deposito      se contiene il codice deposito (m=)
  I QR dei cantieri puntano qui (?l=CODICE): la pagina passa subito a Timbra.

  Qui non c'e' niente da configurare: gli indirizzi stanno in config.js.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comune.css">
<style>
  body { background: var(--carta); }

  /* la fascia gialla: il logo sta sul suo stesso giallo, senza cornice */
  .fascia { background: var(--giallo); padding: calc(18px + env(safe-area-inset-top)) 16px 26px;
            margin-top: calc(-1 * env(safe-area-inset-top)); }
  .fascia .dentro { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
  .fascia img { width: 112px; height: 112px; flex: none; margin: -10px -6px -10px -10px; }
  .saluto { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 34px;
            line-height: 1; color: var(--inchiostro); }
  .saluto small { display: block; font-family: "IBM Plex Sans", sans-serif; font-weight: 500;
                  font-size: 15px; color: #3D4A20; margin-top: 6px; }

  .pagina { padding-top: 22px; padding-bottom: 40px; }

  /* le parti dell'app: pulsanti grandi, da toccare con un dito */
  .voce { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
          background: var(--bianco); border: 0; border-radius: var(--raggio); box-shadow: var(--ombra);
          padding: 18px 16px; margin-bottom: 14px; color: var(--inchiostro); text-decoration: none; }
  .voce:active { transform: translateY(1px); }
  .simbolo { width: 54px; height: 54px; border-radius: 50%; background: var(--inchiostro); flex: none;
             display: flex; align-items: center; justify-content: center; }
  .simbolo svg { width: 28px; height: 28px; }
  .voce b { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 700;
            font-size: 28px; line-height: 1.05; }
  .voce .sotto { display: block; color: var(--grigio); font-size: 15px; margin-top: 3px; }
  .voce .freccia { margin-left: auto; width: 11px; height: 11px; border-right: 2.5px solid #9AA8B5;
                   border-bottom: 2.5px solid #9AA8B5; transform: rotate(-45deg); flex: none; }

  .installa { background: var(--bianco); border: 1.5px dashed var(--linea); border-radius: var(--raggio);
              padding: 14px 16px; font-size: 15px; margin-top: 6px; }
  .installa b { display: block; margin-bottom: 3px; }
  .installa button { margin-top: 10px; }
  .piede { color: #8796A5; font-size: 13px; text-align: center; margin-top: 26px; }
</style>
</head>
<body>

<header class="fascia">
  <div class="dentro">
    <img src="logo.png" alt="Cooperativa San Giovanni">
    <div class="saluto" id="saluto">Ciao<small>Cooperativa San Giovanni</small></div>
  </div>
</header>

<main class="pagina">
  <div id="messaggio"></div>
  <div id="voci"><p class="attesa">Un attimo…</p></div>
  <div id="installa"></div>
  <p class="piede">Cooperativa San Giovanni</p>
</main>

<script src="config.js"></script>
<script src="comune.js"></script>
<script>
/* disegni delle tre parti: semplici, in giallo coop sul cerchio scuro */
var SIMBOLI = {
  timbra: '<svg viewBox="0 0 28 28" fill="none" stroke="#ECE840" stroke-width="2.6" stroke-linecap="round">' +
          '<circle cx="14" cy="14" r="11"/><path d="M14 8v6.5l4 2.5"/></svg>',
  ore: '<svg viewBox="0 0 28 28" fill="none" stroke="#ECE840" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
       '<rect x="4" y="6" width="20" height="18" rx="3"/><path d="M4 11.5h20M9.5 3.5v5M18.5 3.5v5M9 17l3 3 6-6"/></svg>',
  interventi: '<svg viewBox="0 0 28 28" fill="none" stroke="#ECE840" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
              '<rect x="5" y="4" width="18" height="21" rx="3"/><path d="M10 10h8M10 15h8M10 20h5"/></svg>',
  deposito: '<svg viewBox="0 0 28 28" fill="none" stroke="#ECE840" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M4 9.5L14 4l10 5.5v11L14 26 4 20.5z"/><path d="M4 9.5L14 15l10-5.5M14 15v11"/></svg>'
};

var promptInstalla = null;

(function avvio() {
  /* i QR dei cantieri: si va diritti alla timbratura */
  var l = new URLSearchParams(location.search).get('l');
  if (l) { location.replace(RADICE + 'timbra/?l=' + encodeURIComponent(l.trim())); return; }

  codiciDaIndirizzo();
  var c = codici();
  registraSW();

  if (!c.o && !c.d && !c.m) {
    document.getElementById('voci').innerHTML =
      '<div class="card"><h2>Apri il tuo link personale</h2>' +
      '<p style="margin:0">L\'ufficio ti ha mandato su WhatsApp un link solo tuo. Aprilo una volta da ' +
      'questo telefono: da quel momento l\'app ti riconosce.</p></div>';
    return;
  }

  /* i codici restano nell'indirizzo: su iPhone "Aggiungi a Home" salva questo */
  if (location.search.indexOf('o=') < 0 && location.search.indexOf('d=') < 0 && location.search.indexOf('m=') < 0) {
    history.replaceState(null, '', linkPersonale());
  }
  manifestPersonale();

  /* disegno subito con quello che il telefono ricorda, poi chiedo al foglio */
  var ricordo = null;
  try { ricordo = JSON.parse(localStorage.getItem('go.chi') || 'null'); } catch (e) {}
  disegna(ricordo, c);

  api('chi', c).then(function (chi) {
    try { localStorage.setItem('go.chi', JSON.stringify(chi)); } catch (e) {}
    disegna(chi, c);
    if (!chi.nome) avvisa('Il link non è più valido. Chiedi all\'ufficio quello nuovo.');
  }).catch(function (e) {
    if (!ricordo) disegna(null, c);
    if (!e.rete) avvisa(e.message);
  });
})();

/* chi = risposta del foglio (o quella ricordata); c = codici sul telefono */
function disegna(chi, c) {
  var nome = chi && chi.nome ? chi.nome.split(' ')[0] : '';
  document.getElementById('saluto').innerHTML =
    (nome ? 'Ciao ' + esc(nome) : 'Ciao') + '<small>Cosa devi fare?</small>';

  var voci = [];
  /* la timbratura controlla da sola il suo codice: basta averlo */
  if (c.d) voci.push(['timbra', 'timbra/', 'Timbra', 'Entrata e uscita dal cantiere']);
  if (c.o && (!chi || chi.ore || !chi.nome)) {
    if (chi && chi.ore === 'interventi') voci.push(['interventi', 'ore/interventi.html', 'Interventi', 'Segna un lavoro fatto']);
    else voci.push(['ore', 'ore/', 'Ore del mese', 'Controlla e invia le ore']);
  }
  if (c.m && (!chi || chi.deposito || !chi.nome)) voci.push(['deposito', 'deposito/', 'Deposito', 'Segna il materiale che prendi']);

  document.getElementById('voci').innerHTML = voci.map(function (v) {
    return '<a class="voce" href="' + RADICE + v[1] + '"><span class="simbolo" aria-hidden="true">' + SIMBOLI[v[0]] +
           '</span><div><b>' + v[2] + '</b><span class="sotto">' + v[3] + '</span></div><i class="freccia" aria-hidden="true"></i></a>';
  }).join('') || '<p class="attesa">Nessuna parte dell\'app è attiva per te. Chiedi all\'ufficio.</p>';

  disegnaInstalla();
}

function disegnaInstalla() {
  var box = document.getElementById('installa');
  if (inStandalone()) { box.innerHTML = ''; return; }
  if (eIphone()) {
    box.innerHTML = '<div class="installa"><b>Mettila sulla schermata Home</b>' +
      'Tocca il tasto Condividi in basso, poi "Aggiungi a Home". Diventa un\'icona come le altre app.</div>';
  } else if (promptInstalla) {
    box.innerHTML = '<div class="installa"><b>Mettila sulla schermata Home</b>' +
      'Diventa un\'icona come le altre app.<br><button class="secondo" onclick="installa()">Aggiungi alla schermata Home</button></div>';
  }
}

window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  promptInstalla = e;
  disegnaInstalla();
});

function installa() {
  if (!promptInstalla) return;
  promptInstalla.prompt();
  promptInstalla = null;
  document.getElementById('installa').innerHTML = '';
}
</script>
</body>
</html>
