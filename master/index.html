<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2038">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Master">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icona-192.png">
<title>Master — Coop San Giovanni</title>

<!--
  LINK MASTER — per chi gestisce e per il titolare (versione 16)

  Si apre con il link master (menu di Gestione ore: "Crea il link master").
  Vede e corregge tutto, mese per mese:
    Dipendenti   ore, fissi, spese, bonifici: si correggono qui come nella Scheda
    Lavori       chi ci ha lavorato e quanto costa, con la spunta "fatturato"
    Timbrature   tutti i turni, con le uscite dimenticate da sistemare
    Deposito     quanto resta, quando ordinare, chi ha preso cosa
    Link         i link personali da mandare su WhatsApp

  Nei Dipendenti si correggono quante caselle si vuole: restano in giallo e
  si salvano tutte insieme con "Salva tutto" (una domanda al foglio per
  persona, senza ricaricare la pagina). Le righe corrette diventano
  "Corretto" e l'app del dipendente non le sovrascrive piu'.
  Le altre schede (fatturato, timbrature, deposito) salvano subito, come la
  spunta "pagato" accanto a ogni dipendente (foglio Pagamenti).
  "Bonifici dal PDF dei cedolini" legge il PDF del consulente sul dispositivo
  (pdf.js, scaricato solo quando serve) e scrive il netto di ognuno come
  bonifico del mese: al foglio vanno solo nomi e importi, mai il file.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --inchiostro: #0E2038;
    --inchiostro-2: #1B3355;
    --grigio: #5A6B7D;
    --linea: #D6DEE6;
    --linea-chiara: #E8EDF1;
    --carta: #F3F5F7;
    --bianco: #FFFFFF;
    --giallo: #ECE840;
    --blu: #2F6AB0;
    --fatto: #0F7A57;
    --fatto-chiaro: #E3F2EB;
    --dafare: #9A6A00;
    --dafare-chiaro: #FFF3D1;
    --rosso: #B4232A;
    --rosso-chiaro: #FBE9EA;
    --barra: #C5D2E3;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--carta); color: var(--inchiostro);
         font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
         font-size: 16px; line-height: 1.45; padding-bottom: env(safe-area-inset-bottom); }
  .pagina { max-width: 1040px; margin: 0 auto; padding: 16px 18px 70px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nascosto { display: none !important; }
  .solo-tel { display: none; }

  /* ---------- testata ---------- */
  .testata { display: flex; justify-content: space-between; align-items: center; gap: 12px;
             color: var(--grigio); font-size: 14px; }
  .marchio { display: flex; align-items: center; gap: 10px; }
  .marchio img { width: 34px; height: 34px; border-radius: 9px; }
  .marchio strong { color: var(--inchiostro); font-family: "Barlow Condensed", sans-serif;
                    font-size: 21px; font-weight: 700; }
  .aggiorna { background: var(--bianco); border: 1px solid var(--linea); border-radius: 8px;
              padding: 7px 13px; font-size: 14px; }

  /* ---------- la frase del mese ---------- */
  .frase { font-size: clamp(21px, 3.4vw, 32px); line-height: 1.32; font-weight: 400;
           margin: 22px 0 26px; max-width: 31em; }
  .frase b { font-weight: 600; }
  .frase .dafare { color: var(--dafare); }
  .frase .fatto { color: var(--fatto); }
  .mese { appearance: none; -webkit-appearance: none; border: 0; background: none; font-size: inherit;
          font-weight: 600; padding: 0; cursor: pointer; border-bottom: 3px solid var(--inchiostro);
          border-radius: 0; line-height: 1.15; }

  /* ---------- schede ---------- */
  .comandi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
             border-bottom: 1px solid var(--linea); margin-bottom: 4px; }
  .schede { display: flex; gap: 20px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .schede::-webkit-scrollbar { display: none; }
  .scheda { background: none; border: 0; padding: 10px 0 12px; font-size: 17px; color: var(--grigio);
            border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .scheda[aria-selected="true"] { color: var(--inchiostro); font-weight: 600; border-bottom-color: var(--inchiostro); }
  .filtri { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-bottom: 6px; }
  .cerca { border: 1px solid var(--linea); border-radius: 8px; background: var(--bianco);
           padding: 7px 10px; width: 210px; }
  .solo { font-size: 14px; color: var(--grigio); display: flex; align-items: center; gap: 6px;
          cursor: pointer; white-space: nowrap; }

  /* ---------- righe degli elenchi ---------- */
  .riga { border-bottom: 1px solid var(--linea); }
  .testa-riga { display: grid; align-items: center; gap: 4px 16px; width: 100%; padding: 14px 4px;
                background: none; border: 0; text-align: left; }
  .testa-riga:hover { background: rgba(14, 32, 56, .03); }
  .nome { font-size: 17px; font-weight: 600; }
  .breve { font-size: 14px; color: var(--grigio); }
  .importo { font-size: 17px; text-align: right; }
  .freccia { width: 10px; height: 10px; border-right: 2px solid var(--grigio); border-bottom: 2px solid var(--grigio);
             transform: rotate(45deg); transition: transform .15s; justify-self: end; margin-top: -4px; }
  .riga.aperta > .testa-riga .freccia, .riga.aperta > .lavoro-testa .freccia { transform: rotate(-135deg); margin-top: 4px; }

  .persona { display: grid; grid-template-columns: 54px minmax(0, 1fr); }
  .persona > .testa-riga { grid-template-columns: minmax(0, 1fr) 150px 140px 14px; padding-left: 0; }
  .persona > .aperto-qui { grid-column: 1 / -1; padding-left: 54px; }
  .lavoro { display: grid; grid-template-columns: 54px minmax(0, 1fr); }
  .lavoro > .testa-riga { grid-template-columns: minmax(0, 1fr) 140px 120px 14px; padding-left: 0; }
  .lavoro > .aperto-qui { grid-column: 1 / -1; padding-left: 54px; }
  .turnista > .testa-riga { grid-template-columns: minmax(0, 1fr) 140px 14px; }

  .barra-sfondo { height: 8px; background: #E9EDF1; border-radius: 4px; overflow: hidden; }
  .barra-piena { display: block; height: 100%; background: var(--barra); border-radius: 4px; }

  .stato { font-size: 13px; padding: 3px 10px; border-radius: 12px; justify-self: start; white-space: nowrap; }
  .stato.verde { background: var(--fatto-chiaro); color: var(--fatto); }
  .stato.ambra { background: var(--dafare-chiaro); color: #7A5400; }
  .stato.grigio { background: #ECF0F3; color: var(--grigio); }
  .stato.rosso { background: var(--rosso-chiaro); color: var(--rosso); }
  .segnale { color: var(--dafare); font-weight: 600; }
  .verde-t { color: var(--fatto); }

  /* ---------- la spunta "fatturato" ---------- */
  .spunta { display: flex; align-items: center; justify-content: center; position: relative; }
  .spunta input { position: absolute; opacity: 0; width: 1px; height: 1px; left: 0; top: 0; pointer-events: none; }
  .spunta label { width: 34px; height: 34px; border-radius: 8px; cursor: pointer; border: 2px solid #AEB8C2;
                  background: var(--bianco); display: flex; align-items: center; justify-content: center; }
  .spunta label svg { width: 20px; height: 20px; opacity: 0; }
  .spunta input:checked + label { background: var(--fatto); border-color: var(--fatto); }
  .spunta input:checked + label svg { opacity: 1; }
  .spunta input:focus-visible + label { outline: 3px solid var(--blu); outline-offset: 2px; }

  /* ---------- dettaglio che si apre ---------- */
  .aperto-qui { display: none; padding: 4px 4px 24px; }
  .riga.aperta > .aperto-qui { display: block; }
  .blocco + .blocco { margin-top: 20px; }
  .blocco h3 { font-size: 14px; font-weight: 600; color: var(--grigio); margin: 0 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 15px; }
  td, th { padding: 7px 8px 7px 0; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--linea-chiara); }
  th { font-weight: 400; color: var(--grigio); font-size: 13px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .nota { color: var(--grigio); font-size: 13px; }
  tr.totale td { font-weight: 600; border-bottom: 0; }
  .conti { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 22px; margin-bottom: 6px; }
  .conti div { font-size: 13px; color: var(--grigio); }
  .conti b { display: block; font-size: 18px; color: var(--inchiostro); font-weight: 600; }
  .conti .netto b { color: var(--fatto); }

  /* caselle da correggere */
  .cas { width: 84px; height: 36px; border: 1.5px solid var(--linea); border-radius: 8px; padding: 0 8px;
         text-align: right; background: var(--bianco); font-variant-numeric: tabular-nums; }
  .cas.largo { width: 100%; text-align: left; }
  .cas.ora { width: 82px; text-align: center; }
  .cas:focus { outline: 3px solid var(--blu); outline-offset: -1px; border-color: var(--blu); }
  tr.cambiata td { background: #FFFBE6; }
  .bott { border: 1px solid var(--linea); background: var(--bianco); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  .bott.primo { background: var(--inchiostro); color: #fff; border-color: var(--inchiostro); }
  .bott.rosso { color: var(--rosso); }
  .bott:disabled { opacity: .5; }
  .modulo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px;
            align-items: end; background: #F7F9FA; border: 1px solid var(--linea-chiara); border-radius: 10px;
            padding: 12px; margin-top: 10px; }
  .modulo label { font-size: 13px; color: var(--grigio); display: block; }
  .modulo .cas { width: 100%; text-align: left; margin-top: 3px; }
  .timb { font-size: 13px; color: var(--inchiostro-2); white-space: nowrap; }
  .timb.diversa { color: var(--dafare); font-weight: 600; }

  .vuoto, .attesa { color: var(--grigio); padding: 26px 4px; }
  .errore { background: var(--dafare-chiaro); color: #5C4000; border-radius: 8px; padding: 14px 16px; margin: 16px 0; }
  #messaggio { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 20; width: min(92vw, 520px); }
  #messaggio div { background: var(--inchiostro); color: #fff; border-radius: 10px; padding: 12px 16px;
                   box-shadow: 0 10px 30px rgba(14, 32, 56, .25); font-size: 15px; }
  #messaggio div.male { background: var(--rosso); }

  /* modifiche non ancora salvate */
  .cas.cambiata { background: #FFFBE6; border-color: #E2C766; }
  .ripristina { background: none; border: 0; padding: 4px 0; color: var(--blu); font-size: 13px;
                text-decoration: underline; text-underline-offset: 2px; }
  .dasalvare { color: var(--dafare); font-weight: 600; }
  .spiega-mod { color: var(--grigio); font-size: 14px; margin: 0 0 14px; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--inchiostro); color: #fff;
           padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(14, 32, 56, .18); }
  .barra-dentro { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; }
  .barra-testo { flex: 1 1 220px; font-size: 15px; }
  .barra .bott { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4); padding: 9px 16px; font-size: 15px; }
  .barra .bott.salva { background: var(--giallo); color: var(--inchiostro); border-color: var(--giallo); font-weight: 600; }
  body.con-barra .pagina { padding-bottom: 120px; }
  body.con-barra #messaggio { bottom: 90px; }

  /* bonifici dai cedolini */
  .ced-avvio { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
  .ced-avvio .bott { cursor: pointer; }
  .ced { background: var(--bianco); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 16px; margin: 12px 0 8px; }
  .ced-testa { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ced-testa h3 { margin: 0; font-size: 16px; color: var(--inchiostro); }
  .ced select.cas { min-width: 170px; }
  .ced-azioni { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; }
  .ced-azioni .primo { padding: 9px 16px; font-size: 15px; }

  .sezione { margin: 26px 0 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sezione h2 { font-family: "Barlow Condensed", sans-serif; font-size: 24px; font-weight: 700; margin: 0; }
  .sezione .spiega { color: var(--grigio); font-size: 14px; }

  .link-riga { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) auto; gap: 8px 14px;
               align-items: center; padding: 12px 0; border-bottom: 1px solid var(--linea); }
  .link-riga input { width: 100%; height: 36px; border: 1px solid var(--linea); border-radius: 8px;
                     padding: 0 8px; font-size: 13px; color: var(--grigio); background: #F7F9FA; }
  .link-riga .azioni { display: flex; gap: 6px; }

  @media (max-width: 720px) {
    .pagina { padding: 12px 14px 70px; }
    .filtri { margin-left: 0; width: 100%; justify-content: space-between; padding-bottom: 10px; }
    .cerca { width: 100%; max-width: 230px; }
    .lavoro, .persona { grid-template-columns: 46px minmax(0, 1fr); }
    .lavoro > .aperto-qui, .persona > .aperto-qui { padding-left: 0; }
    .lavoro > .testa-riga, .persona > .testa-riga { grid-template-columns: minmax(0, 1fr) auto 14px; }
    .testa-riga .barra-sfondo { grid-column: 1 / 2; grid-row: 3; margin-top: 4px; }
    .persona > .testa-riga .stato { grid-column: 1 / 2; grid-row: 2; }
    .colonna-media { display: none; }
    .solo-tel { display: inline-block !important; margin-top: 4px; }
    .tabella-scorre { overflow-x: auto; }
    .link-riga { grid-template-columns: 1fr auto; }
    .link-riga input { grid-column: 1 / -1; grid-row: 2; }
    .barra { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
    .barra-testo { flex-basis: 100%; }
    .barra .bott.salva { flex: 1; }
    body.con-barra .pagina { padding-bottom: 150px; }
    body.con-barra #messaggio { bottom: 124px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="pagina">
  <div class="testata">
    <div class="marchio"><img src="../icona-192.png" alt=""><strong>Master</strong> <span id="aggiornato"></span></div>
    <button class="aggiorna" onclick="aggiornaTutto()">Aggiorna</button>
  </div>

  <h1 class="frase" id="frase"><span class="attesa">Carico i numeri del mese…</span></h1>

  <div class="comandi nascosto" id="comandi">
    <div class="schede" role="tablist">
      <button class="scheda" role="tab" id="tab-persone" aria-selected="true" onclick="scegliScheda('persone')">Dipendenti</button>
      <button class="scheda" role="tab" id="tab-lavori" aria-selected="false" onclick="scegliScheda('lavori')">Lavori</button>
      <button class="scheda" role="tab" id="tab-timbrature" aria-selected="false" onclick="scegliScheda('timbrature')">Timbrature</button>
      <button class="scheda" role="tab" id="tab-deposito" aria-selected="false" onclick="scegliScheda('deposito')">Deposito</button>
      <button class="scheda" role="tab" id="tab-link" aria-selected="false" onclick="scegliScheda('link')">Link</button>
    </div>
    <div class="filtri">
      <label class="solo nascosto" id="filtro-solo"><input type="checkbox" id="solo" onchange="disegnaElenco()"> <span id="filtro-testo">Solo da fatturare</span></label>
      <input class="cerca" id="cerca" type="search" placeholder="Cerca un nome" oninput="disegnaElenco()" aria-label="Cerca">
    </div>
  </div>

  <div id="elenco"></div>
</main>
<div class="barra nascosto" id="barra" role="region" aria-label="Modifiche da salvare">
  <div class="barra-dentro">
    <span class="barra-testo" id="barra-testo" aria-live="polite"></span>
    <button class="bott" id="barra-annulla" onclick="annullaModifiche()">Annulla</button>
    <button class="bott salva" id="barra-salva" onclick="salvaTutto()">Salva tutto</button>
  </div>
</div>
<div id="messaggio" aria-live="polite"></div>

<script src="../config.js"></script>
<script src="../comune.js"></script>
<script>
/* ================================================================
   VARIABILI GENERALI
   ================================================================ */

codiciDaIndirizzo();
var CHIAVE = leggiCodice('k');    /* codice del link master, ricordato dal telefono */
var D = null;                     /* il mese: dipendenti e lavori */
var T = null;                     /* le timbrature del mese */
var DEP = null;                   /* il deposito */
var LNK = null;                   /* i link personali */
var DETT = {};                    /* il dettaglio delle persone aperte */
var MOD = {};                     /* modifiche non ancora salvate, persona per persona */
var STATO = { mese: null, scheda: 'persone', aperti: {}, mesiDep: 3, moduli: {}, rileggi: false, ced: null };

var SVG_SPUNTA = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#fff" ' +
                 'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function ore(n) { return num(n) + (Number(n) === 1 ? ' ora' : ' ore'); }
function q(s) { return String(s).replace(/'/g, "\\'"); }

function corrisponde(testo) {
  var x = document.getElementById('cerca').value.trim().toLowerCase();
  return !x || String(testo).toLowerCase().indexOf(x) >= 0;
}

/* messaggio in basso che sparisce da solo */
function dici(testo, male) {
  var box = document.getElementById('messaggio');
  box.innerHTML = '<div' + (male ? ' class="male"' : '') + '>' + esc(testo) + '</div>';
  clearTimeout(dici.t);
  dici.t = setTimeout(function () { box.innerHTML = ''; }, male ? 8000 : 3500);
}

/* L'icona sulla Home apre il master, gia' riconosciuto. */
function manifestMaster() {
  try {
    var m = { name: 'Master Coop SG', short_name: 'Master', start_url: RADICE + 'master/?k=' + encodeURIComponent(CHIAVE),
              scope: RADICE, display: 'standalone', background_color: '#F3F5F7', theme_color: '#0E2038',
              icons: [{ src: new URL('icona-192.png', RADICE).href, sizes: '192x192', type: 'image/png' },
                      { src: new URL('icona-512.png', RADICE).href, sizes: '512x512', type: 'image/png' }] };
    var l = document.createElement('link');
    l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  } catch (e) {}
}


/* ================================================================
   1. CARICAMENTO
   ================================================================ */

function caricaMese(mese) {
  document.getElementById('elenco').innerHTML = '<div class="attesa">Carico…</div>';
  return api('master.mese', { k: CHIAVE, mese: mese }).then(function (d) {
    D = d; STATO.mese = d.mese; T = null; DETT = {};
    disegnaTutto();
  }).catch(function (e) {
    document.getElementById('frase').innerHTML = '';
    document.getElementById('elenco').innerHTML = '<div class="errore">' + esc(e.message) +
      (/non valido/.test(e.message) ? ' Chiedi il link nuovo a chi gestisce il foglio.' : '') + '</div>';
  });
}

/* Ricarica i numeri del mese senza chiudere niente e senza perdere le
   modifiche non salvate. Serve solo dopo una correzione delle timbrature
   (cambiano le ore timbrate), e si fa quando si torna a Dipendenti o Lavori. */
function rinfrescaMese() {
  STATO.rileggi = false;
  return api('master.mese', { k: CHIAVE, mese: STATO.mese }).then(function (d) {
    D = d; DETT = {};
    applicaSpunteInViaggio();
    disegnaFrase();
    if (STATO.scheda === 'persone' || STATO.scheda === 'lavori') disegnaElenco();
  }).catch(function () { STATO.rileggi = true; });
}

function aggiornaTutto() {
  if (!lasciaModifiche()) return;
  DEP = null; LNK = null; T = null;
  caricaMese(STATO.mese);
}

function caricaTimbrature() {
  document.getElementById('elenco').innerHTML = '<div class="attesa">Carico le timbrature…</div>';
  api('master.timbrature', { k: CHIAVE, mese: STATO.mese }).then(function (t) {
    T = t; if (STATO.scheda === 'timbrature') disegnaElenco();
  }).catch(function (e) { document.getElementById('elenco').innerHTML = '<div class="errore">' + esc(e.message) + '</div>'; });
}

function caricaDeposito() {
  document.getElementById('elenco').innerHTML = '<div class="attesa">Carico il deposito…</div>';
  api('master.deposito', { k: CHIAVE, mesi: STATO.mesiDep }).then(function (d) {
    DEP = d; if (STATO.scheda === 'deposito') disegnaElenco();
  }).catch(function (e) { document.getElementById('elenco').innerHTML = '<div class="errore">' + esc(e.message) + '</div>'; });
}

function caricaLink() {
  document.getElementById('elenco').innerHTML = '<div class="attesa">Carico i link…</div>';
  api('master.persone', { k: CHIAVE }).then(function (d) {
    LNK = d; if (STATO.scheda === 'link') disegnaElenco();
  }).catch(function (e) { document.getElementById('elenco').innerHTML = '<div class="errore">' + esc(e.message) + '</div>'; });
}


/* ================================================================
   2. DISEGNO GENERALE
   ================================================================ */

function disegnaTutto() {
  document.getElementById('aggiornato').textContent = 'aggiornato alle ' + D.aggiornato.slice(-5);
  document.getElementById('comandi').classList.remove('nascosto');
  impostaFiltro(STATO.scheda);
  disegnaFrase();
  disegnaElenco();
}

function disegnaFrase() {
  var t = D.totali;
  var scelta = '<select class="mese" aria-label="Mese" onchange="cambiaMese(this.value)">' +
    D.mesi.map(function (m) { return '<option' + (m === D.mese ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('') + '</select>';
  var h = 'Per ' + scelta + ' ci sono <b class="num">' + eur(t.daPagare) + '</b> da pagare a ' + plurale(t.persone, 'persona', 'persone');
  if (t.inviati && t.inviati === t.persone) h += ', e tutti hanno già inviato le ore. ';
  else if (t.inviati) h += '; ' + t.inviati + (t.inviati === 1 ? ' ha' : ' hanno') + ' già inviato le ore. ';
  else h += '. ';
  /* le buste gia' pagate (la spunta accanto a ogni dipendente) */
  if (t.pagati && t.pagati === t.persone) h += '<span class="fatto">Le hai già pagate tutte.</span> ';
  else if (t.pagati) h += 'Ne hai già ' + (t.pagati === 1 ? 'pagata una' : 'pagate ' + t.pagati) +
                          ', restano <b class="num">' + eur(t.restaDaPagare) + '</b>. ';
  var cambiate = D.persone.filter(function (p) {
    return p.pagato && p.pagatoImporto !== null && p.pagatoImporto !== undefined && Math.abs(p.pagatoImporto - p.netto) > 0.005;
  }).length;
  if (cambiate) h += '<span class="dafare">' + (cambiate === 1 ? 'Una busta è cambiata' : cambiate + ' buste sono cambiate') + ' dopo il pagamento.</span> ';
  if (!t.lavori) h += 'Nessun lavoro registrato.';
  else if (!t.daFatturare) h += '<span class="fatto">' + (t.lavori === 1 ? 'L\'unico lavoro è fatturato.' : 'Tutti i ' + t.lavori + ' lavori sono fatturati.') + '</span>';
  else h += '<span class="dafare">' + (t.lavori === 1 ? 'Il lavoro è ancora da fatturare.' :
            '<b>' + t.daFatturare + '</b> lavori su ' + t.lavori + ' ' + (t.daFatturare === 1 ? 'è' : 'sono') + ' ancora da fatturare.') + '</span>';
  if (t.daPrezzare) h += ' <span class="dafare">' + plurale(t.daPrezzare, 'intervento', 'interventi') + ' da prezzare.</span>';
  var segn = D.persone.reduce(function (s, p) { return s + (p.segnalazioniTimbrature || 0); }, 0);
  if (segn) h += ' <span class="dafare">' + plurale(segn, 'turno timbrato', 'turni timbrati') + ' da controllare.</span>';
  document.getElementById('frase').innerHTML = h;
  adattaMese();
  /* ricalcolo quando il carattere e' arrivato, se no la misura e' sbagliata */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(adattaMese);
}

/* la tendina del mese larga quanto il mese scritto */
function adattaMese() {
  var sel = document.querySelector('.mese');
  if (!sel) return;
  var p = document.createElement('span');
  p.className = 'mese';
  p.style.cssText = 'position:absolute;visibility:hidden;border:0;white-space:nowrap';
  p.textContent = sel.value;
  sel.parentNode.appendChild(p);
  sel.style.width = (p.getBoundingClientRect().width + 4) + 'px';
  p.remove();
}

function cambiaMese(m) {
  if (!lasciaModifiche()) { document.querySelector('.mese').value = STATO.mese; adattaMese(); return; }
  STATO.aperti = {}; STATO.ced = null; caricaMese(m);
}

/* la casella "Solo da ..." accanto alla ricerca, diversa per ogni scheda */
function impostaFiltro(s) {
  var testoFiltro = { persone: 'Solo da pagare', lavori: 'Solo da fatturare', timbrature: 'Solo da controllare' }[s];
  document.getElementById('filtro-solo').classList.toggle('nascosto', !testoFiltro);
  if (testoFiltro) document.getElementById('filtro-testo').textContent = testoFiltro;
  document.getElementById('solo').checked = false;
}

function scegliScheda(s) {
  STATO.scheda = s;
  ['persone', 'lavori', 'timbrature', 'deposito', 'link'].forEach(function (x) {
    document.getElementById('tab-' + x).setAttribute('aria-selected', x === s);
  });
  impostaFiltro(s);
  document.getElementById('cerca').placeholder = s === 'lavori' ? 'Cerca un lavoro' : (s === 'deposito' ? 'Cerca un prodotto o un nome' : 'Cerca un nome');
  if (s === 'timbrature' && !T) return caricaTimbrature();
  if (s === 'deposito' && !DEP) return caricaDeposito();
  if (s === 'link' && !LNK) return caricaLink();
  disegnaElenco();
  /* dopo una correzione delle timbrature: i numeri si aggiornano adesso, in sottofondo */
  if ((s === 'persone' || s === 'lavori') && STATO.rileggi) rinfrescaMese();
}

function disegnaElenco() {
  var el = document.getElementById('elenco');
  var f = { persone: elencoPersone, lavori: elencoLavori, timbrature: elencoTimbrature,
            deposito: elencoDeposito, link: elencoLink }[STATO.scheda];
  el.innerHTML = f();
  if (STATO.scheda === 'persone') Object.keys(STATO.aperti).forEach(function (id) {
    if (STATO.aperti[id] && id.charAt(0) === 'p') riempiPersona(id);
  });
}

function apri(id) {
  STATO.aperti[id] = !STATO.aperti[id];
  var r = document.getElementById(id);
  if (!r) return;
  r.classList.toggle('aperta', STATO.aperti[id]);
  var b = r.querySelector('.testa-riga');
  if (b) b.setAttribute('aria-expanded', STATO.aperti[id]);
  if (STATO.aperti[id] && id.charAt(0) === 'p') riempiPersona(id);
}

function testaRiga(id, sinistra, centro, destra) {
  return '<button class="testa-riga" aria-expanded="' + !!STATO.aperti[id] + '" onclick="apri(\'' + id + '\')">' +
         '<span>' + sinistra + '</span>' + centro + '<span class="importo num">' + destra + '</span><span class="freccia"></span></button>';
}


/* ================================================================
   3. DIPENDENTI — con le correzioni
   Le caselle cambiate restano in giallo e si salvano tutte insieme
   con "Salva tutto" (la barra in basso). Finche' non si salva niente
   va nel foglio, e ridisegnare la pagina non le perde: i valori delle
   caselle si prendono da MOD.
   ================================================================ */

function elencoPersone() {
  var solo = document.getElementById('solo').checked;
  var lista = D.persone.filter(function (p) { return corrisponde(p.nome) && (!solo || !p.pagato); });
  if (!lista.length) return pannelloCedolini() + '<div class="vuoto">' + (solo ? 'Nessuno da pagare: tutte le buste sono pagate.' : 'Nessun nome corrisponde alla ricerca.') + '</div>';
  return pannelloCedolini() + lista.map(function (p) {
    var k = D.persone.indexOf(p), id = 'p' + k;
    var stato = p.stato === 'inviato' ? '<span class="stato verde">ha inviato</span>'
              : p.stato === 'in compilazione' ? '<span class="stato ambra">sta compilando</span>'
              : p.righe.length ? '<span class="stato grigio">solo fissi</span>' : '<span class="stato grigio">nessun dato</span>';
    var breve = [];
    if (p.ore) breve.push(ore(p.ore) + ' segnate');
    if (p.oreTimbrate) breve.push(num(p.oreTimbrate) + ' timbrate');
    if (p.fissi) breve.push('fissi ' + eur(p.fissi));
    if (p.bonifico) breve.push('bonifico ' + eur(p.bonifico));
    if (p.segnalazioniTimbrature) breve.push('<span class="segnale">' + plurale(p.segnalazioniTimbrature, 'turno', 'turni') + ' da controllare</span>');
    if (p.daPrezzare) breve.push('<span class="segnale">' + plurale(p.daPrezzare, 'intervento', 'interventi') + ' da prezzare</span>');
    if (p.pagato) {
      breve.push('<span class="verde-t">pagato' + (p.pagatoIl ? ' il ' + esc(p.pagatoIl.slice(0, 5)) : '') + '</span>');
      /* il netto e' cambiato dopo la spunta: c'e' una differenza da dare o da riprendere */
      if (p.pagatoImporto !== null && p.pagatoImporto !== undefined && Math.abs(p.pagatoImporto - p.netto) > 0.005) {
        breve.push('<span class="segnale">pagati ' + eur(p.pagatoImporto) + ', ora ' + eur(p.netto) + '</span>');
      }
    }
    return '<div class="riga persona' + (STATO.aperti[id] ? ' aperta' : '') + '" id="' + id + '">' +
      '<div class="spunta"><input type="checkbox" id="pg' + k + '"' + (p.pagato ? ' checked' : '') +
      ' onchange="paga(' + k + ', this.checked)" aria-label="Pagato: ' + esc(p.nome) + '">' +
      '<label for="pg' + k + '" title="Pagato">' + SVG_SPUNTA + '</label></div>' +
      testaRiga(id, '<span class="nome">' + esc(p.nome) + '</span><br><span class="breve">' + (breve.join(', ') || 'nessuna voce') +
                '<span class="dasalvare" id="' + id + 'x">' + testoDaSalvare(p.nome) + '</span></span>',
                stato, eur(p.netto)) +
      '<div class="aperto-qui" id="' + id + '-d"><div class="attesa">Carico…</div></div></div>';
  }).join('');
}

/* Il dettaglio modificabile: lo chiede al foglio la prima volta che si apre. */
function riempiPersona(id) {
  var p = D.persone[Number(id.slice(1))], qui = document.getElementById(id + '-d');
  if (!p || !qui) return;            /* aperta ma nascosta dalla ricerca o dal filtro */
  if (DETT[p.nome]) { qui.innerHTML = dettaglioPersona(id, p, DETT[p.nome]); return; }
  api('master.persona', { k: CHIAVE, mese: STATO.mese, nome: p.nome }).then(function (d) {
    DETT[p.nome] = d;
    var box = document.getElementById(id + '-d');
    if (box) box.innerHTML = dettaglioPersona(id, p, d);
  }).catch(function (e) {
    var box = document.getElementById(id + '-d');
    if (box) box.innerHTML = '<div class="errore">' + esc(e.message) + '</div>';
  });
}

/* ridisegna solo il dettaglio di una persona (le altre caselle non si toccano) */
function ridisegnaPersona(id) {
  var p = D.persone[Number(id.slice(1))], box = document.getElementById(id + '-d');
  if (box && DETT[p.nome]) box.innerHTML = dettaglioPersona(id, p, DETT[p.nome]);
}

var SEZIONI = [['LAVORI', 'Lavori del mese'], ['FISSI', 'Compensi fissi'], ['SPESE', 'Spese'],
               ['RISERVATO', 'Riservato (il dipendente non lo vede)']];

function dettaglioPersona(id, p, d) {
  var m = MOD[p.nome] || { voci: {}, nuove: [] };
  var h = '<div class="blocco"><div class="conti">' +
    '<div>Lavori<b class="num">' + eur(p.lavori) + '</b></div>' +
    '<div>Fissi<b class="num">' + eur(p.fissi) + '</b></div>' +
    '<div>Spese<b class="num">' + eur(p.spese) + '</b></div>' +
    '<div>Bonifico<b class="num">' + eur(p.bonifico) + '</b></div>' +
    (p.trattenute ? '<div>Trattenute<b class="num">' + eur(p.trattenute) + '</b></div>' : '') +
    '<div class="netto">Da pagare<b class="num">' + eur(p.netto) + '</b></div></div></div>' +
    '<p class="spiega-mod">Correggi tutte le caselle che vuoi, anche di più persone: si salvano insieme con «Salva tutto», in basso.</p>';

  var tb = (d.timbrate && d.timbrate.perLavoro) || {};
  SEZIONI.forEach(function (s) {
    var voci = d.voci.map(function (v, i) { return [v, i]; }).filter(function (x) { return x[0].sezione === s[0]; });
    if (!voci.length) return;
    h += '<div class="blocco tabella-scorre"><h3>' + s[1] + '</h3><table><tr><th>Luogo</th><th>Voce</th>' +
         '<th class="n">Quantità</th><th class="n">Prezzo</th><th class="n colonna-media">Importo</th><th></th></tr>';
    voci.forEach(function (x) {
      var v = x[0], i = x[1], rid = id + 'v' + i, c = m.voci[chiaveVoce(v)];
      var qv = c ? c.q : (v.q === '' ? '' : v.q), pv = c ? c.prezzo : v.prezzo;
      var aOre = String(v.unita).toLowerCase() === 'ore';
      var t = aOre ? tb[v.commessa] : null;
      var timb = (t !== null && t !== undefined)
        ? '<br><span class="timb' + (Math.abs((Number(v.q) || 0) - t) > 0.01 ? ' diversa' : '') + '">timbrate ' + num(t) + '</span>' : '';
      h += '<tr id="' + rid + '"' + (c ? ' class="cambiata"' : '') + '><td>' + esc(v.commessa === '(voci generali)' ? 'Spese generali' : v.commessa) + '</td>' +
           '<td>' + esc(v.voce) + (v.note ? '<br><span class="nota">' + esc(v.note) + '</span>' : '') + '</td>' +
           '<td class="n"><input class="cas" type="number" inputmode="decimal" step="0.25" value="' + esc(qv) + '" ' +
             'oninput="cambiaVoce(\'' + id + '\',' + i + ')" aria-label="Quantità ' + esc(v.voce) + '">' + timb + '</td>' +
           '<td class="n"><input class="cas" type="number" inputmode="decimal" step="0.5" value="' + esc(pv) + '" ' +
             'oninput="cambiaVoce(\'' + id + '\',' + i + ')" aria-label="Prezzo ' + esc(v.voce) + '"></td>' +
           '<td class="n colonna-media" data-importo>' + eur(numero(qv) * numero(pv)) + '</td>' +
           '<td class="n"><button class="ripristina' + (c ? '' : ' nascosto') + '" onclick="ripristinaVoce(\'' + id + '\',' + i + ')">Ripristina</button></td></tr>';
    });
    h += '</table></div>';
  });

  /* bonifico e trattenute: sempre a portata */
  var bon = d.voci.filter(function (v) { return v.unita === 'bonifico'; })[0];
  var tra = d.voci.filter(function (v) { return v.unita === 'trattenuta'; })[0];
  var vb = m.bon !== undefined ? m.bon : (bon ? bon.prezzo : '');
  var vt = m.tra !== undefined ? m.tra : (tra ? tra.prezzo : '');
  h += '<div class="blocco"><h3>Da togliere dalla busta</h3><div class="modulo">' +
       '<label>Bonifico già fatto (€)<input class="cas' + (m.bon !== undefined ? ' cambiata' : '') + '" id="' + id + 'bon" type="number" inputmode="decimal" step="0.5" value="' + esc(vb) + '" oninput="cambiaDetrazione(\'' + id + '\',\'bon\')"></label>' +
       '<label>Trattenute (€)<input class="cas' + (m.tra !== undefined ? ' cambiata' : '') + '" id="' + id + 'tra" type="number" inputmode="decimal" step="0.5" value="' + esc(vt) + '" oninput="cambiaDetrazione(\'' + id + '\',\'tra\')"></label>' +
       '</div></div>';

  /* le voci in piu', prima nella lista e poi nel foglio con Salva tutto */
  h += '<div class="blocco"><h3>Aggiungi una voce</h3>';
  if (m.nuove.length) {
    h += '<div class="tabella-scorre"><table><tr><th>Luogo</th><th>Voce</th><th class="n">Quantità</th><th class="n">Prezzo</th><th class="n colonna-media">Importo</th><th></th></tr>' +
      m.nuove.map(function (x, j) {
        return '<tr class="cambiata"><td>' + esc(x.commessa === '(voci generali)' ? 'Spese generali' : x.commessa) + '</td><td>' + esc(x.voce) +
               '<br><span class="nota">nuova, ' + esc(x.unita === 'ore' ? 'a ore' : x.unita) + '</span></td>' +
               '<td class="n">' + num(x.q) + '</td><td class="n">' + eur(numero(x.prezzo)) + '</td>' +
               '<td class="n colonna-media">' + eur(numero(x.q) * numero(x.prezzo)) + '</td>' +
               '<td class="n"><button class="ripristina" onclick="togliNuova(\'' + id + '\',' + j + ')">Togli</button></td></tr>';
      }).join('') + '</table></div>';
  }
  h += '<div class="modulo">' +
       '<label>Luogo<input class="cas" id="' + id + 'nl" list="' + id + 'com" placeholder="Cerca o scrivi"></label>' +
       '<datalist id="' + id + 'com">' + (d.commesse || []).map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>' +
       '<label>Voce<input class="cas" id="' + id + 'nv" placeholder="Es. Ore, Straordinario, Spese"></label>' +
       '<label>Come si paga<select class="cas" id="' + id + 'nu"><option value="ore">a ore</option>' +
         '<option value="importo in €">importo</option><option value="fisso">fisso</option></select></label>' +
       '<label>Quantità<input class="cas" id="' + id + 'nq" type="number" inputmode="decimal" step="0.25" placeholder="ore, o 1"></label>' +
       '<label>Prezzo (€)<input class="cas" id="' + id + 'np" type="number" inputmode="decimal" step="0.5"></label>' +
       '<div><button class="bott" onclick="aggiungiVoce(\'' + id + '\')">Aggiungi alla lista</button></div></div></div>';

  if (d.note && d.note.length) h += '<div class="blocco"><h3>Note del dipendente</h3><p style="margin:0">' + esc(d.note.join(' — ')) + '</p></div>';
  if (d.timbrate && d.timbrate.altrove && d.timbrate.altrove.length) {
    h += '<div class="blocco"><h3>Timbrate su lavori che non sono in Commesse</h3>' +
         d.timbrate.altrove.map(function (a) { return esc(a.lavoro) + ': ' + ore(a.ore); }).join('<br>') + '</div>';
  }
  return h;
}


/* ---------------- le modifiche in sospeso ----------------
   MOD["Anna Rossi"] = {
     voci:  { "Condominio 1|Ore": { commessa, voce, unita, q, prezzo } },   caselle cambiate
     bon, tra:  "120"                                                     solo se cambiati
     nuove: [ { commessa, voce, unita, q, prezzo } ]                       voci aggiunte
   }                                                                                    */

function chiaveVoce(v) { return v.commessa + '|' + v.voce; }
function numero(x) { return parseFloat(String(x == null ? '' : x).replace(',', '.')) || 0; }
function stessoNumero(a, b) { return Math.abs(numero(a) - numero(b)) < 0.0001; }

function modDi(nome) { return MOD[nome] || (MOD[nome] = { voci: {}, nuove: [] }); }
function quanteDi(nome) {
  var m = MOD[nome];
  if (!m) return 0;
  return Object.keys(m.voci).length + (m.bon !== undefined ? 1 : 0) + (m.tra !== undefined ? 1 : 0) + m.nuove.length;
}
function contaModifiche() { return Object.keys(MOD).reduce(function (s, n) { return s + quanteDi(n); }, 0); }
function pulisci(nome) { if (MOD[nome] && !quanteDi(nome)) delete MOD[nome]; }
function testoDaSalvare(nome) { var n = quanteDi(nome); return n ? ', ' + plurale(n, 'modifica', 'modifiche') + ' da salvare' : ''; }

function personaDa(id) { return D.persone[Number(id.slice(1))]; }

function cambiaVoce(id, i) {
  var p = personaDa(id), v = DETT[p.nome].voci[i], tr = document.getElementById(id + 'v' + i);
  var c = tr.querySelectorAll('input'), qv = c[0].value, pv = c[1].value;
  var uguale = stessoNumero(qv, v.q) && stessoNumero(pv, v.prezzo);   /* vuoto e 0 valgono uguale */
  var m = modDi(p.nome), k = chiaveVoce(v);
  if (uguale) delete m.voci[k];
  else m.voci[k] = { commessa: v.commessa, voce: v.voce, unita: v.unita, q: qv, prezzo: pv };
  tr.classList.toggle('cambiata', !uguale);
  tr.querySelector('[data-importo]').textContent = eur(numero(qv) * numero(pv));
  tr.querySelector('.ripristina').classList.toggle('nascosto', uguale);
  pulisci(p.nome); aggiornaBarra();
}

function ripristinaVoce(id, i) {
  var p = personaDa(id), v = DETT[p.nome].voci[i];
  if (MOD[p.nome]) delete MOD[p.nome].voci[chiaveVoce(v)];
  pulisci(p.nome); ridisegnaPersona(id); aggiornaBarra();
}

function cambiaDetrazione(id, quale) {
  var p = personaDa(id), d = DETT[p.nome], casella = document.getElementById(id + quale);
  var unita = quale === 'bon' ? 'bonifico' : 'trattenuta';
  var prima = d.voci.filter(function (v) { return v.unita === unita; })[0];
  var uguale = stessoNumero(casella.value, prima ? prima.prezzo : 0);
  var m = modDi(p.nome);
  if (uguale) delete m[quale]; else m[quale] = casella.value;
  casella.classList.toggle('cambiata', !uguale);
  pulisci(p.nome); aggiornaBarra();
}

function aggiungiVoce(id) {
  var p = personaDa(id);
  var g = function (x) { return document.getElementById(id + x).value.trim(); };
  if (!g('nl') || !g('nv')) return dici('Scrivi il luogo e la voce.', true);
  if (!(numero(g('nq')) > 0)) return dici('Scrivi la quantità: le ore, oppure 1 per un importo.', true);
  modDi(p.nome).nuove.push({ commessa: g('nl'), voce: g('nv'), unita: g('nu'), q: g('nq'), prezzo: g('np') || '0' });
  ridisegnaPersona(id); aggiornaBarra();
  var primo = document.getElementById(id + 'nl');
  if (primo) primo.focus();
}

function togliNuova(id, j) {
  var p = personaDa(id);
  if (MOD[p.nome]) MOD[p.nome].nuove.splice(j, 1);
  pulisci(p.nome); ridisegnaPersona(id); aggiornaBarra();
}

/* la barra in basso, e il "N modifiche da salvare" accanto a ogni nome */
var SALVO = false;
function aggiornaBarra() {
  var n = contaModifiche(), nomi = Object.keys(MOD);
  document.getElementById('barra').classList.toggle('nascosto', !n && !SALVO);
  document.body.classList.toggle('con-barra', !!n || SALVO);
  if (D) D.persone.forEach(function (p, i) {
    var x = document.getElementById('p' + i + 'x');
    if (x) x.textContent = testoDaSalvare(p.nome);
  });
  document.getElementById('barra-salva').disabled = SALVO;
  document.getElementById('barra-annulla').disabled = SALVO;
  if (SALVO) return;
  document.getElementById('barra-testo').innerHTML = '<b>' + plurale(n, 'modifica', 'modifiche') + '</b> da salvare' +
    (nomi.length === 1 ? ' per ' + esc(nomi[0]) : ' per ' + nomi.length + ' persone');
}

/* Prima di cambiare mese o ricaricare: true se si puo' andare avanti. */
function lasciaModifiche() {
  var n = contaModifiche();
  if (!n) return true;
  if (!confirm('Hai ' + plurale(n, 'modifica', 'modifiche') + ' non ancora ' + (n === 1 ? 'salvata' : 'salvate') +
               '. Se vai avanti ' + (n === 1 ? 'si perde' : 'si perdono') + '.\n\nVuoi davvero andare avanti?')) return false;
  MOD = {}; aggiornaBarra();
  return true;
}

function annullaModifiche() {
  var n = contaModifiche();
  if (n > 1 && !confirm('Annullo le ' + n + ' modifiche non salvate?')) return;
  MOD = {}; aggiornaBarra();
  if (STATO.scheda === 'persone') disegnaElenco();
}

/* Le voci da mandare al foglio per una persona. */
function vociDa(m) {
  var out = Object.keys(m.voci).map(function (k) { return m.voci[k]; });
  if (m.bon !== undefined) out.push({ commessa: '(bonifico)', voce: 'Bonifico', unita: 'bonifico', q: 1, prezzo: m.bon || 0 });
  if (m.tra !== undefined) out.push({ commessa: '(trattenuta)', voce: 'Trattenuta', unita: 'trattenuta', q: 1, prezzo: m.tra || 0 });
  return out.concat(m.nuove);
}

/* Una domanda al foglio per persona, una dopo l'altra. Il foglio risponde
   con il dettaglio e i numeri del mese gia' rifatti: non si ricarica niente. */
function salvaTutto() {
  if (SALVO) return;
  var nomi = Object.keys(MOD).filter(quanteDi);
  if (!nomi.length) return;
  SALVO = true; aggiornaBarra();
  var fatti = 0, errori = [], catena = Promise.resolve();
  nomi.forEach(function (nome, j) {
    catena = catena.then(function () {
      var m = MOD[nome];
      if (!m) return;
      /* com'era al momento dell'invio: se intanto cambi qualcosa, quello resta da salvare */
      var inviate = { voci: Object.assign({}, m.voci), bon: m.bon, tra: m.tra, nuove: m.nuove.slice() };
      document.getElementById('barra-testo').textContent = 'Salvo' + (nomi.length > 1 ? ' ' + (j + 1) + ' di ' + nomi.length : '') + '…';
      return api('master.voci', { k: CHIAVE, mese: STATO.mese, nome: nome, voci: vociDa(inviate) }).then(function (r) {
        var prima = DETT[nome];
        if (r.persona.timbrateNonLette && prima) r.persona.timbrate = prima.timbrate;
        DETT[nome] = r.persona;
        nuoviNumeri(r.mese);
        togliSalvate(nome, inviate);
        fatti++;
      }).catch(function (e) { errori.push(nome + ': ' + e.message); });
    });
  });
  catena.then(function () {
    SALVO = false;
    disegnaFrase();
    if (STATO.scheda === 'persone' || STATO.scheda === 'lavori') disegnaElenco();
    aggiornaBarra();
    if (errori.length) dici('Non salvato. ' + errori.join(' — ') + ' Le caselle restano in giallo: riprova.', true);
    else dici(fatti === 1 ? 'Salvato nel Registro.' : 'Salvate nel Registro le modifiche di ' + fatti + ' persone.');
  });
}

function togliSalvate(nome, inviate) {
  var m = MOD[nome];
  if (!m) return;
  Object.keys(inviate.voci).forEach(function (k) { if (m.voci[k] === inviate.voci[k]) delete m.voci[k]; });
  if (inviate.bon !== undefined && m.bon === inviate.bon) delete m.bon;
  if (inviate.tra !== undefined && m.tra === inviate.tra) delete m.tra;
  m.nuove = m.nuove.filter(function (x) { return inviate.nuove.indexOf(x) < 0; });
  pulisci(nome);
}

/* I numeri del mese arrivati con il salvataggio. Le ore timbrate non
   cambiano salvando una voce: restano quelle che la pagina aveva gia'. */
function nuoviNumeri(nuovo) {
  var prima = {};
  D.persone.forEach(function (p) { prima[p.nome] = p; });
  nuovo.persone.forEach(function (p) {
    var x = prima[p.nome];
    p.oreTimbrate = x ? x.oreTimbrate : 0;
    p.segnalazioniTimbrature = x ? x.segnalazioniTimbrature : 0;
  });
  nuovo.timbrature = D.timbrature;
  D = nuovo;
  applicaSpunteInViaggio();
  document.getElementById('aggiornato').textContent = 'aggiornato alle ' + D.aggiornato.slice(-5);
}


/* ---------------- la spunta "pagato" ----------------
   Cambia subito; se il foglio non risponde torna com'era. Finche' la
   spunta e' in viaggio, se arrivano numeri nuovi del mese vince la spunta. */

var IN_VIAGGIO = {};

function segnaQui(p, valore, il, importo) {
  p.pagato = valore;
  p.pagatoIl = valore ? il : '';
  p.pagatoImporto = valore ? importo : null;
}

function ricontaPagati() {
  var t = D.totali;
  t.pagati = 0; t.restaDaPagare = 0;
  D.persone.forEach(function (p) { if (p.pagato) t.pagati++; else t.restaDaPagare += p.netto; });
  t.restaDaPagare = Math.round(t.restaDaPagare * 100) / 100;
}

function applicaSpunteInViaggio() {
  D.persone.forEach(function (p) {
    var x = IN_VIAGGIO[p.nome];
    if (x) segnaQui(p, x.valore, x.il, p.netto);
  });
  ricontaPagati();
}

function paga(k, valore) {
  var p = D.persone[k], nome = p.nome, mese = D.mese;
  var prima = { valore: p.pagato, il: p.pagatoIl, importo: p.pagatoImporto };
  var oggi = new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  segnaQui(p, valore, oggi, p.netto);
  IN_VIAGGIO[nome] = { valore: valore, il: oggi };
  ricontaPagati(); disegnaFrase(); disegnaElenco();
  api('master.pagato', { k: CHIAVE, mese: mese, nome: nome, pagato: valore, importo: p.netto }).then(function () {
    delete IN_VIAGGIO[nome];
    dici(valore ? nome + ': segnato come pagato.' : nome + ': tolto il pagato.');
  }).catch(function (e) {
    delete IN_VIAGGIO[nome];
    if (D.mese === mese) {
      var q = D.persone.filter(function (x) { return x.nome === nome; })[0];
      if (q) segnaQui(q, prima.valore, prima.il, prima.importo);
      ricontaPagati(); disegnaFrase();
      if (STATO.scheda === 'persone') disegnaElenco();
    }
    dici('Non sono riuscito a salvare la spunta di ' + nome + ': ' + e.message, true);
  });
}

/* chiudere o ricaricare la pagina con modifiche non salvate: il browser chiede conferma */
window.addEventListener('beforeunload', function (e) {
  if (contaModifiche() || SALVO) { e.preventDefault(); e.returnValue = ''; }
});


/* ================================================================
   3b. BONIFICI DAI CEDOLINI
   Carichi il PDF con i cedolini del mese (quello del consulente):
   la pagina lo legge QUI, sul telefono o sul computer, con pdf.js.
   Per ogni cedolino trova la persona e la RETRIBUZIONE NETTA, e ti fa
   controllare tutto prima di scrivere. Al foglio arrivano solo nomi e
   importi: il PDF non viene salvato da nessuna parte.
   Casi particolari:
   - "Bonifico fisso" nel foglio Dipendenti (per esempio 350 per chi ha
     le detrazioni): vale quello e non il netto del cedolino;
   - cedolino di congedo (maternita' e simili) e nessun compenso
     nell'app: non si scrive, se no la persona risulterebbe in debito;
   - nome scritto in un altro modo (Michela/Michelina, Gina/Luigia):
     la riga e' proposta in giallo, da controllare.
   ================================================================ */

var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
var MESI_IT = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio',
               'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
var CODICE_FISCALE = /\b[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]\b/;
var CODICE_FISCALE_TUTTI = /\b[A-Z]{6}\d{2}[A-Z]\d{2}[A-Z]\d{3}[A-Z]\b/g;

/* il lettore di PDF si scarica solo quando serve */
function caricaPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise(function (ok, ko) {
    var s = document.createElement('script');
    s.src = PDFJS + 'pdf.min.js';
    s.onload = function () { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(pdfjsLib); };
    s.onerror = function () { ko(new Error('Non riesco a caricare il lettore di PDF. Controlla la connessione e riprova.')); };
    document.head.appendChild(s);
  });
}

function semplice(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function parole(s) { return semplice(s).split(' ').filter(function (w) { return w; }); }

/* "1.234,56" -> 1234.56 ; null se non e' un importo */
function importoDa(t) {
  var m = String(t || '').replace(/[*€\s]/g, '').match(/-?\d{1,3}(?:\.\d{3})+,\d{2}|-?\d+,\d{2}/);
  return m ? Number(m[0].replace(/\./g, '').replace(',', '.')) : null;
}

/* Il testo di una pagina, riga per riga, con la posizione di ogni pezzo. */
function righeDiPagina(pagina) {
  return pagina.getTextContent().then(function (c) {
    var pezzi = c.items.filter(function (it) { return String(it.str).trim(); }).map(function (it) {
      return { s: String(it.str), x: it.transform[4], y: it.transform[5], w: it.width || 0 };
    });
    pezzi.sort(function (a, b) { return (b.y - a.y) || (a.x - b.x); });
    var righe = [];
    pezzi.forEach(function (p) {
      var r = righe.length ? righe[righe.length - 1] : null;
      if (r && Math.abs(r.y - p.y) <= 3) r.pezzi.push(p);
      else righe.push({ y: p.y, pezzi: [p] });
    });
    righe.forEach(function (r) {
      r.pezzi.sort(function (a, b) { return a.x - b.x; });
      var t = '';
      r.pezzi.forEach(function (p) { if (t) t += ' '; p.da = t.length; t += p.s; });
      r.testo = t;
      r.parole = parole(t);
      r.cf = CODICE_FISCALE.test(t);
    });
    return righe;
  });
}

/* ---- chi e' la persona del cedolino ---- */

function distanza(a, b) {
  var d = [];
  for (var i = 0; i <= a.length; i++) { d[i] = [i]; }
  for (var j = 0; j <= b.length; j++) d[0][j] = j;
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  }
  return d[a.length][b.length];
}
/* michela ~ michelina, samatha ~ samantha */
function simili(a, b) {
  if (a === b) return true;
  if (a.length < 4 || b.length < 4) return false;
  var p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  return p >= 5 || distanza(a, b) <= (Math.min(a.length, b.length) >= 6 ? 2 : 1);
}

/* Quanto bene una riga contiene il nome:
   3 = tutto uguale (anche "ANNA VERA" per Annavera), 2 = simile, 1 = solo il cognome. */
function livelloNome(nome, r) {
  var t = parole(nome).filter(function (w) { return w.length > 1; });
  if (!t.length) return 0;
  var W = r.parole;
  if (t.every(function (w) { return W.indexOf(w) >= 0; })) return 3;
  /* nome attaccato o staccato in modo diverso */
  var giri = [];
  for (var i = 0; i < t.length; i++) giri.push(t.slice(i).concat(t.slice(0, i)).join(''));
  for (var a = 0; a < W.length; a++) {
    var s = '';
    for (var b = a; b < W.length && b < a + t.length + 2; b++) {
      s += W[b];
      if (giri.indexOf(s) >= 0) return 3;
    }
  }
  if (!r.cf) return 0;                               /* i confronti larghi solo sulla riga del nome */
  var esatte = t.filter(function (w) { return W.indexOf(w) >= 0; }).length;
  if (esatte && t.every(function (w) { return W.some(function (x) { return simili(w, x); }); })) return 2;
  var cognome = t[t.length - 1];
  if (cognome.length >= 4 && W.indexOf(cognome) >= 0) return 1;
  return 0;
}

function nomeDiPagina(righe, persone) {
  var cand = [];
  persone.forEach(function (nome) {
    var meglio = null;
    righe.forEach(function (r, i) {
      var l = livelloNome(nome, r);
      if (l && (!meglio || l > meglio.livello)) meglio = { nome: nome, livello: l, riga: i };
    });
    if (meglio) cand.push(meglio);
  });
  if (!cand.length) return null;
  var top = Math.max.apply(null, cand.map(function (c) { return c.livello; }));
  var primi = cand.filter(function (c) { return c.livello === top; });
  if (primi.length > 1) {
    /* a parita': il nome con piu' parole (Maria Grazia Sica batte Sica) */
    var lung = function (c) { return parole(c.nome).length; };
    var max = Math.max.apply(null, primi.map(lung));
    primi = primi.filter(function (c) { return lung(c) === max; });
  }
  if (primi.length !== 1) return null;              /* due persone possibili: decidi tu */
  /* solo il cognome: vale se nessun altro dipendente ha lo stesso cognome */
  if (top === 1) {
    var cogn = parole(primi[0].nome).pop();
    if (persone.filter(function (n) { return parole(n).pop() === cogn; }).length > 1) return null;
  }
  var letto = righe[primi[0].riga].testo.replace(CODICE_FISCALE_TUTTI, '').replace(/\s+/g, ' ').trim();
  return { nome: primi[0].nome, livello: top, letto: letto };
}

/* ---- il netto ---- */

var NETTO_BUONO = /retribuzione\s+netta|netto\s*(?:in\s*busta|del\s*mese|a\s*pagare|da\s*pagare|busta|pagato|corrisposto)/i;
var NETTO_SOLO = /\bnett[oa]\b/i;

function pezzoA(r, i) {
  var q = r.pezzi[0];
  r.pezzi.forEach(function (p) { if (p.da <= i) q = p; });
  return q;
}

function nettoDiPagina(righe) {
  var trovato = null;
  [NETTO_BUONO, NETTO_SOLO].some(function (re) {
    righe.forEach(function (r, i) {
      var m = r.testo.match(re);
      if (!m) return;
      if (re === NETTO_SOLO && /imponib|irpef|lordo|contribut|accant|tfr/i.test(r.testo)) return;
      var inizio = m.index, fine = m.index + m[0].length;
      var pa = pezzoA(r, inizio), pb = pezzoA(r, fine - 1);
      var sx = pa.x, dx = pb.x + pb.w;
      /* 1. sulla stessa riga, subito dopo l'etichetta */
      var v = importoDa(r.testo.slice(fine).split(/[a-z]{4,}/i)[0]);
      /* 2. altrimenti sotto, nella stessa colonna */
      if (v === null) {
        for (var j = i + 1; j < righe.length && r.y - righe[j].y < 70 && v === null; j++) {
          righe[j].pezzi.forEach(function (p) {
            var n = importoDa(p.s);
            if (n !== null && v === null && p.x < dx + 30 && p.x + p.w > sx - 30) v = n;
          });
        }
      }
      if (v !== null) trovato = v;      /* vale l'ultimo della pagina: il netto sta in fondo */
    });
    return trovato !== null;
  });
  return trovato;
}

/* un cedolino di congedo (maternita' e simili): retribuzione a ore a zero, paga l'INPS */
function congedoDi(testo) {
  if (/mat\.?\s*pat|maternit/i.test(testo)) return 'maternità';
  if (/congedo\s*a\s*42|art\.?\s*42/i.test(testo)) return 'congedo art. 42';
  if (/congedo\s*parentale/i.test(testo)) return 'congedo parentale';
  return /congedo/i.test(testo) ? 'congedo' : '';
}

/* ---- dal PDF alla tabella ---- */

function apriCedolini(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  STATO.ced = { file: f.name, stato: 'leggo', righe: [], pagine: 0, mesePdf: '' };
  disegnaElenco();
  var lettore = new FileReader();
  lettore.onload = function () { leggiCedolini(new Uint8Array(lettore.result)); };
  lettore.onerror = function () { erroreCed('Non riesco ad aprire il file.'); };
  lettore.readAsArrayBuffer(f);
}

function erroreCed(testo) {
  if (!STATO.ced) return;
  STATO.ced.stato = 'errore'; STATO.ced.errore = testo;
  if (STATO.scheda === 'persone') disegnaElenco();
}

/* tutti i dipendenti del foglio (anche chi non ha ancora niente nel mese), con il bonifico fisso */
function anagraficaCed() {
  if (LNK) return Promise.resolve(LNK);
  return api('master.persone', { k: CHIAVE }).then(function (d) { LNK = d; return d; })
    .catch(function () { return { persone: D.persone.map(function (p) { return { nome: p.nome }; }) }; });
}

function leggiCedolini(dati) {
  var anag;
  Promise.all([caricaPdfJs(), anagraficaCed()]).then(function (x) {
    anag = x[1].persone;
    return x[0].getDocument({ data: dati }).promise;
  }).then(function (pdf) {
    var nomi = anag.map(function (p) { return p.nome; });
    var lette = [], catena = Promise.resolve();
    for (var n = 1; n <= pdf.numPages; n++) (function (n) {
      catena = catena.then(function () { return pdf.getPage(n); }).then(righeDiPagina).then(function (righe) {
        var tutto = righe.map(function (r) { return r.testo; }).join('\n');
        var cf = tutto.match(CODICE_FISCALE);
        lette.push({ n: n, righe: righe, testo: tutto, nome: nomeDiPagina(righe, nomi),
                     netto: nettoDiPagina(righe), cf: cf ? cf[0] : '', congedo: congedoDi(tutto) });
      });
    })(n);
    return catena.then(function () { return { pdf: pdf, lette: lette }; });
  }).then(function (r) {
    if (!STATO.ced) return;
    var c = STATO.ced;
    c.pagine = r.pdf.numPages;
    if (!r.lette.some(function (p) { return p.testo.trim(); })) {
      return erroreCed('Nel PDF non c\'è testo da leggere: sembra una scansione. ' +
                       'I bonifici vanno scritti a mano, oppure chiedi al consulente il PDF originale.');
    }
    c.righe = raggruppaCedolini(r.lette, anag);
    c.nomi = anag.map(function (p) { return p.nome; });
    var conta = {};
    r.lette.forEach(function (p) {
      var re = new RegExp('(' + MESI_IT.join('|') + ')\\s+(20\\d\\d)', 'gi'), m;
      while ((m = re.exec(p.testo))) { var k = m[1].toLowerCase() + ' ' + m[2]; conta[k] = (conta[k] || 0) + 1; }
    });
    c.mesePdf = Object.keys(conta).sort(function (a, b) { return conta[b] - conta[a]; })[0] || '';
    c.stato = 'pronto';
    if (STATO.scheda === 'persone') disegnaElenco();
  }).catch(function (e) {
    erroreCed(e && e.message && !/pdf/i.test(e.name || '') ? e.message : 'Non riesco a leggere questo PDF.');
  });
}

/* Pagine -> una riga per persona. Una pagina senza nome e senza un codice
   fiscale nuovo e' il seguito del cedolino prima (cedolini di due pagine). */
function raggruppaCedolini(lette, anag) {
  var gruppi = [], ultimo = null;
  lette.forEach(function (p) {
    if (p.nome) {
      var g = gruppi.filter(function (x) { return x.nome === p.nome.nome; })[0];
      if (!g) { g = { nome: p.nome.nome, livello: p.nome.livello, pagine: [], netti: [], letto: p.nome.letto, cf: p.cf, congedo: '' }; gruppi.push(g); }
      g.pagine.push(p.n);
      if (p.netto !== null) g.netti.push(p.netto);
      if (p.congedo) g.congedo = p.congedo;
      ultimo = g;
      return;
    }
    var seguito = ultimo && (!p.cf || p.cf === ultimo.cf) && !(p.netto !== null && ultimo.netti.length);
    if (seguito) {
      ultimo.pagine.push(p.n);
      if (p.netto !== null) ultimo.netti.push(p.netto);
      if (p.congedo) ultimo.congedo = p.congedo;
      return;
    }
    /* nessun dipendente riconosciuto: si assegna a mano, o si lascia */
    var riga = p.righe.filter(function (r) { return r.cf; })[0];
    gruppi.push({ nome: '', livello: 0, pagine: [p.n], netti: p.netto !== null ? [p.netto] : [], cf: p.cf, congedo: p.congedo,
                  letto: riga ? riga.testo.replace(CODICE_FISCALE_TUTTI, '').replace(/\s+/g, ' ').trim().slice(0, 60) : 'nessun nome riconosciuto' });
    ultimo = null;
  });

  var fissi = {};
  anag.forEach(function (a) { if (a.bonificoFisso) fissi[a.nome] = a.bonificoFisso; });
  return gruppi.map(function (g) {
    var somma = Math.round(g.netti.reduce(function (s, x) { return s + x; }, 0) * 100) / 100;
    var r = { nome: g.nome, pagine: g.pagine, letto: g.letto, note: [], giallo: false,
              cedolino: g.netti.length ? somma : null, netto: g.netti.length ? somma : '' };
    if (g.netti.length > 1) r.note.push(g.netti.length + ' cedolini, sommati');
    if (g.livello === 2) { r.note.push('nome scritto in modo diverso: controlla'); r.giallo = true; }
    if (g.livello === 1) { r.note.push('coincide solo il cognome: controlla'); r.giallo = true; }
    if (g.nome && fissi[g.nome]) {
      r.netto = fissi[g.nome];
      r.note.push('bonifico fisso ' + eur(fissi[g.nome]) + (r.cedolino !== null ? ' (nel cedolino ' + eur(r.cedolino) + ')' : ''));
    }
    if (g.congedo) {
      var p = D.persone.filter(function (x) { return x.nome === g.nome; })[0];
      var nellApp = p ? p.totale : 0;
      if (g.nome && !nellApp) {
        r.note.push('in ' + g.congedo + ' e senza compensi nell\'app: non lo scrivo, se no risulterebbe in debito. ' +
                    'Se vuoi scriverlo lo stesso, scegli il nome');
        r.proposto = g.nome; r.nome = ''; r.giallo = true;
      } else if (g.nome) {
        r.note.push('in ' + g.congedo + ', ma nell\'app ha ' + eur(nellApp) + ' di compensi: controlla');
        r.giallo = true;
      }
    }
    if (r.netto === '') r.note.push('netto non trovato: scrivilo tu');
    if (!g.nome && !r.proposto) r.giallo = true;
    return r;
  });
}

function pagineTesto(v) {
  if (v.length === 1) return 'pag. ' + v[0];
  var consecutive = v.every(function (x, i) { return !i || x === v[i - 1] + 1; });
  return 'pag. ' + (consecutive ? v[0] + '–' + v[v.length - 1] : v.join(', '));
}

/* il riquadro in cima all'elenco dei dipendenti */
function pannelloCedolini() {
  var c = STATO.ced;
  if (!c) {
    return '<div class="ced-avvio"><label class="bott"><input type="file" accept="application/pdf,.pdf" ' +
           'onchange="apriCedolini(this)" hidden>Bonifici dal PDF dei cedolini</label>' +
           '<span class="nota">legge la retribuzione netta di ognuno e la scrive come bonifico di ' + esc(STATO.mese) + '</span></div>';
  }
  var h = '<div class="ced"><div class="ced-testa"><h3>Bonifici dai cedolini, ' + esc(STATO.mese) + '</h3>' +
          '<button class="bott" onclick="chiudiCedolini()">Chiudi</button></div>';
  if (c.stato === 'leggo') return h + '<p class="attesa">Leggo ' + esc(c.file) + '…</p></div>';
  if (c.stato === 'errore') return h + '<div class="errore">' + esc(c.errore) + '</div></div>';

  h += '<p class="nota">' + esc(c.file) + ', ' + plurale(c.pagine, 'pagina', 'pagine') +
       '. Il PDF resta qui: al foglio vanno solo nomi e importi. Le righe gialle sono da guardare.</p>';
  if (c.mesePdf && c.mesePdf !== STATO.mese) {
    h += '<div class="errore">Il PDF sembra di <b>' + esc(c.mesePdf) + '</b>, ma stai guardando <b>' + esc(STATO.mese) +
         '</b>. I bonifici vanno nel mese che vedi in alto: se è sbagliato, chiudi e cambia mese.</div>';
  }
  var opzioni = function (scelto) {
    return '<option value="">non scrivere</option>' + (c.nomi || []).map(function (n) {
      return '<option' + (n === scelto ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  };
  h += '<div class="tabella-scorre"><table><tr><th>Dipendente</th><th>Nel PDF</th><th class="n">Bonifico</th><th class="n">Bonifico ora</th></tr>';
  c.righe.forEach(function (r, i) {
    var p = D.persone.filter(function (x) { return x.nome === r.nome; })[0];
    var ora = p ? p.bonifico : 0;
    var diverso = p && r.netto !== '' && ora && Math.abs(ora - Number(r.netto)) > 0.005;
    h += '<tr' + (r.giallo ? ' class="cambiata"' : '') + '><td><select class="cas largo" onchange="cedNome(' + i + ', this.value)" aria-label="Dipendente">' +
         opzioni(r.nome) + '</select></td>' +
         '<td class="nota">' + esc(pagineTesto(r.pagine)) + ', ' + esc(r.letto) +
           (r.cedolino !== null ? '<br>retribuzione netta ' + eur(r.cedolino) : '') +
           r.note.map(function (x) { return '<br><span class="segnale">' + esc(x) + '</span>'; }).join('') + '</td>' +
         '<td class="n"><input class="cas" type="number" inputmode="decimal" step="0.01" min="0" value="' + esc(r.netto) + '" ' +
           'oninput="cedNetto(' + i + ', this.value)" aria-label="Bonifico"></td>' +
         '<td class="n' + (diverso ? ' segnale' : '') + '">' + (ora ? eur(ora) : '') + '</td></tr>';
  });
  h += '</table></div>';
  var n = c.righe.filter(function (r) { return r.nome && Number(r.netto) > 0; }).length;
  h += '<div class="ced-azioni"><button class="bott primo" onclick="scriviBonificiCed()"' + (n ? '' : ' disabled') + '>' +
       (n ? 'Scrivi ' + plurale(n, 'bonifico', 'bonifici') : 'Nessun bonifico da scrivere') + '</button>' +
       '<span class="nota">Sostituiscono i bonifici già scritti per ' + esc(STATO.mese) + '. Il dipendente non li vede.</span></div></div>';
  return h;
}

function cedNome(i, v) {
  var r = STATO.ced.righe[i];
  r.nome = v;
  /* chi ha il bonifico fisso: scelto a mano, prende il fisso */
  var a = (LNK && LNK.persone || []).filter(function (x) { return x.nome === v; })[0];
  if (a && a.bonificoFisso) r.netto = a.bonificoFisso;
  disegnaElenco();
}
function cedNetto(i, v) {
  STATO.ced.righe[i].netto = v === '' ? '' : Number(v);
  /* aggiorno solo il pulsante, cosi' la casella non perde il cursore */
  var n = STATO.ced.righe.filter(function (r) { return r.nome && Number(r.netto) > 0; }).length;
  var b = document.querySelector('.ced-azioni .primo');
  if (b) { b.disabled = !n; b.textContent = n ? 'Scrivi ' + plurale(n, 'bonifico', 'bonifici') : 'Nessun bonifico da scrivere'; }
}
function chiudiCedolini() { STATO.ced = null; disegnaElenco(); }

function scriviBonificiCed() {
  var c = STATO.ced, visti = {}, doppio = '';
  var righe = c.righe.filter(function (r) { return r.nome && Number(r.netto) > 0; }).map(function (r) {
    if (visti[r.nome]) doppio = r.nome;
    visti[r.nome] = true;
    return { nome: r.nome, importo: Number(r.netto) };
  });
  if (doppio) return dici(doppio + ' è scelto in due righe: lasciane una sola (o somma tu i due importi).', true);
  if (!righe.length) return;
  if (!confirm('Scrivo ' + plurale(righe.length, 'bonifico', 'bonifici') + ' per ' + STATO.mese + '?\n\n' +
               'Se qualcuno aveva già un bonifico in questo mese, viene sostituito.')) return;
  var b = document.querySelector('.ced-azioni .primo');
  if (b) { b.disabled = true; b.textContent = 'Scrivo…'; }
  api('master.bonifici', { k: CHIAVE, mese: STATO.mese, righe: righe }).then(function (r) {
    righe.forEach(function (x) {
      delete DETT[x.nome];                        /* il dettaglio si rilegge con il bonifico nuovo */
      if (MOD[x.nome]) { delete MOD[x.nome].bon; pulisci(x.nome); }
    });
    nuoviNumeri(r.mese);
    STATO.ced = null;
    disegnaFrase(); disegnaElenco(); aggiornaBarra();
    dici('Scritti ' + plurale(r.scritti, 'bonifico', 'bonifici') + ' di ' + STATO.mese + '.');
  }).catch(function (e) {
    if (b) { b.disabled = false; b.textContent = 'Scrivi ' + plurale(righe.length, 'bonifico', 'bonifici'); }
    dici('Non ho scritto i bonifici: ' + e.message, true);
  });
}


/* ================================================================
   4. LAVORI — con la spunta "fatturato"
   ================================================================ */

function elencoLavori() {
  var solo = document.getElementById('solo').checked;
  var lista = D.lavori.filter(function (l) { return corrisponde(l.luogo) && (!solo || (!l.fatturato && !l.generale)); });
  if (!lista.length) return '<div class="vuoto">' + (solo ? 'Nessun lavoro da fatturare: tutto fatto.' : 'Nessun lavoro corrisponde alla ricerca.') + '</div>';
  var massimo = Math.max.apply(null, D.lavori.map(function (l) { return l.totale; })) || 1;
  return lista.map(function (l) {
    var k = D.lavori.indexOf(l), id = 'l' + k, breve = [];
    if (l.ore) breve.push(ore(l.ore));
    breve.push(plurale(l.persone.length, 'persona', 'persone'));
    if (l.spese) breve.push('spese ' + eur(l.spese));
    if (l.generale) breve.push('non si fattura');
    else if (l.fatturato) breve.push('<span class="verde-t">fatturato' + (l.fatturatoIl ? ' il ' + esc(l.fatturatoIl.slice(0, 10)) : '') + '</span>');
    if (l.daPrezzare) breve.push('<span class="segnale">' + l.daPrezzare + ' da prezzare</span>');
    return '<div class="riga lavoro' + (STATO.aperti[id] ? ' aperta' : '') + '" id="' + id + '">' +
      (l.generale ? '<div></div>' :
       '<div class="spunta"><input type="checkbox" id="f' + k + '"' + (l.fatturato ? ' checked' : '') +
       ' onchange="fattura(' + k + ', this.checked)" aria-label="Fatturato: ' + esc(l.luogo) + '">' +
       '<label for="f' + k + '" title="Fatturato">' + SVG_SPUNTA + '</label></div>') +
      testaRiga(id, '<span class="nome">' + esc(l.luogo) + '</span><br><span class="breve">' + breve.join(', ') + '</span>',
                '<span class="barra-sfondo" aria-hidden="true"><span class="barra-piena" style="width:' +
                Math.max(3, Math.round(l.totale / massimo * 100)) + '%"></span></span>', eur(l.totale)) +
      '<div class="aperto-qui">' + dettaglioLavoro(l) + '</div></div>';
  }).join('');
}

function dettaglioLavoro(l) {
  var h = '<div class="blocco"><h3>Chi ci ha lavorato</h3><table><tr><th>Dipendente</th><th class="n">Ore</th><th class="n">Compenso</th></tr>';
  l.persone.forEach(function (p) {
    h += '<tr><td>' + esc(p.nome) + '</td><td class="n">' + (p.ore ? num(p.ore) : '') + '</td><td class="n">' + eur(p.importo) + '</td></tr>';
  });
  h += '<tr class="totale"><td>Totale</td><td class="n">' + (l.ore ? num(l.ore) : '') + '</td><td class="n">' + eur(l.totale) + '</td></tr></table></div>';
  h += '<div class="blocco"><h3>Voce per voce</h3><table><tr><th>Dipendente</th><th>Voce</th><th class="n colonna-media">Quantità</th><th class="n">Importo</th></tr>';
  l.righe.forEach(function (r) {
    h += '<tr><td>' + esc(r.nome) + '</td><td>' + esc(r.voce) + (r.tipo === 'Spesa' ? ' (spesa)' : '') +
         (r.nota ? '<br><span class="nota">' + esc(r.nota) + '</span>' : '') + '</td>' +
         '<td class="n colonna-media">' + (r.tipo === 'Ore' ? ore(r.q) + ' x ' + eur(r.prezzo) : '') + '</td><td class="n">' + eur(r.importo) + '</td></tr>';
  });
  return h + '</table></div>';
}

/* la spunta cambia subito; se il foglio non risponde torna com'era */
function fattura(k, valore) {
  var l = D.lavori[k];
  l.fatturato = valore;
  l.fatturatoIl = valore ? new Date().toLocaleDateString('it-IT') : '';
  D.totali.daFatturare += valore ? -1 : 1;
  disegnaFrase(); disegnaElenco();
  api('master.fatturato', { k: CHIAVE, mese: D.mese, luogo: l.luogo, fatturato: valore }).catch(function (e) {
    l.fatturato = !valore;
    D.totali.daFatturare += valore ? 1 : -1;
    disegnaFrase(); disegnaElenco();
    dici('Non sono riuscito a salvare la spunta: ' + e.message, true);
  });
}


/* ================================================================
   5. TIMBRATURE — turni e correzioni
   ================================================================ */

function opzioniLavori(scelto) {
  return T.lavori.map(function (l) {
    return '<option value="' + esc(l.codice) + '"' + (l.codice === scelto ? ' selected' : '') + '>' + esc(l.nome) + '</option>';
  }).join('');
}

function elencoTimbrature() {
  if (!T) return '<div class="attesa">Carico le timbrature…</div>';
  if (!T.collegato) return '<div class="errore">Le timbrature non sono ancora collegate. Nel foglio Gestione ore: menu ' +
                           'Gestione ore, "Collega le timbrature".</div>';
  var solo = document.getElementById('solo').checked;
  var lista = T.persone.filter(function (p) { return corrisponde(p.nome) && (!solo || p.segnalazioni); });
  var h = '';
  if (!lista.length) h += '<div class="vuoto">' + (solo ? 'Nessun turno da controllare in ' + esc(T.mese) + '.' : 'Nessuna timbratura in ' + esc(T.mese) + '.') + '</div>';

  h += lista.map(function (p) {
    var k = T.persone.indexOf(p), id = 't' + k;
    var turni = p.turni.filter(function (t) { return !solo || t.grave; });
    var breve = [plurale(p.turni.length, 'turno', 'turni')];
    if (p.segnalazioni) breve.push('<span class="segnale">' + plurale(p.segnalazioni, 'da controllare', 'da controllare') + '</span>');
    var tab = '<div class="tabella-scorre"><table><tr><th>Giorno</th><th>Cantiere</th><th class="n">Entrata</th><th class="n">Uscita</th>' +
              '<th class="n">Ore</th><th>Segnalazioni</th><th></th></tr>';
    turni.forEach(function (t) {
      var j = p.turni.indexOf(t), mid = id + 'm' + j;
      tab += '<tr' + (t.grave ? ' style="background:#FFFBE6"' : '') + '><td class="num">' + esc(t.data.slice(0, 5)) + '</td>' +
             '<td>' + esc(t.lavoro) + (t.commessa && t.commessa !== t.lavoro ? '<br><span class="nota">' + esc(t.commessa) + '</span>' : '') + '</td>' +
             '<td class="n">' + (t.entrata || '<span class="segnale">manca</span>') + '</td>' +
             '<td class="n">' + (t.uscita || '<span class="segnale">manca</span>') + '</td>' +
             '<td class="n">' + (t.ore ? num(t.ore) : '') + '</td>' +
             '<td class="nota">' + esc(t.segnalazioni.join(', ')) + '</td>' +
             '<td class="n"><button class="bott" onclick="moduloTurno(\'' + mid + '\',' + k + ',' + j + ')">Correggi</button> ' +
             '<button class="bott rosso" onclick="annullaTurno(' + k + ',' + j + ')">Annulla</button></td></tr>' +
             '<tr class="nascosto" id="' + mid + '"><td colspan="7"></td></tr>';
    });
    tab += '</table></div>';
    tab += '<div class="blocco"><h3>Aggiungi un turno</h3>' + moduloNuovo(id + 'n', p.idDip) + '</div>';
    return '<div class="riga turnista' + (STATO.aperti[id] ? ' aperta' : '') + '" id="' + id + '">' +
      testaRiga(id, '<span class="nome">' + esc(p.nome) + '</span><br><span class="breve">' + breve.join(', ') + '</span>', '', ore(p.ore)) +
      '<div class="aperto-qui">' + tab + '</div></div>';
  }).join('');

  /* chi non ha timbrature questo mese */
  var conTurni = {};
  T.persone.forEach(function (p) { conTurni[p.idDip] = true; });
  var senza = T.tutti.filter(function (x) { return !conTurni[x.idDip]; });
  h += '<div class="sezione"><h2>Aggiungi un turno a qualcuno</h2><span class="spiega">anche a chi questo mese non ha timbrato</span></div>' +
       moduloNuovo('libero', '', '<label>Dipendente<select class="cas" id="chiNuovo">' +
       T.tutti.map(function (x) { return '<option value="' + esc(x.idDip) + '">' + esc(x.nome) + (conTurni[x.idDip] ? '' : ' (nessun turno)') + '</option>'; }).join('') +
       '</select></label>');
  return h;
}

function moduloNuovo(id, idDip, primo) {
  return '<div class="modulo">' + (primo || '') +
    '<label>Giorno<input class="cas" type="date" id="' + id + 'g"></label>' +
    '<label>Cantiere<select class="cas" id="' + id + 'c">' + opzioniLavori('') + '</select></label>' +
    '<label>Entrata<input class="cas" type="time" id="' + id + 'e"></label>' +
    '<label>Uscita<input class="cas" type="time" id="' + id + 'u"></label>' +
    '<div><button class="bott primo" onclick="nuovoTurno(\'' + id + '\',\'' + esc(idDip) + '\')">Aggiungi</button></div></div>';
}

function moduloTurno(mid, k, j) {
  var t = T.persone[k].turni[j], tr = document.getElementById(mid);
  tr.classList.toggle('nascosto');
  tr.firstChild.innerHTML = '<div class="modulo">' +
    '<label>Cantiere<select class="cas" id="' + mid + 'c">' + opzioniLavori(t.codice) + '</select></label>' +
    '<label>Entrata<input class="cas" type="time" id="' + mid + 'e" value="' + esc(t.entrata) + '"></label>' +
    '<label>Uscita<input class="cas" type="time" id="' + mid + 'u" value="' + esc(t.uscita) + '"></label>' +
    '<div><button class="bott primo" onclick="correggiTurno(\'' + mid + '\',' + k + ',' + j + ')">Salva</button></div></div>';
}

function inviaTimbra(dati) {
  return api('master.timbra', Object.assign({ k: CHIAVE, mese: STATO.mese }, dati)).then(function (t) {
    T = t; disegnaElenco(); dici('Timbrature aggiornate.');
    STATO.rileggi = true;   /* le ore timbrate di Dipendenti e Lavori si rifanno quando ci torni */
  }).catch(function (e) { dici(e.message, true); });
}

function correggiTurno(mid, k, j) {
  var p = T.persone[k], t = p.turni[j];
  var e = document.getElementById(mid + 'e').value, u = document.getElementById(mid + 'u').value;
  if (!e) return dici('Scrivi l\'ora di entrata.', true);
  inviaTimbra({ op: 'correggi', idDip: p.idDip, righe: t.righe, codice: document.getElementById(mid + 'c').value,
                giorno: t.giorno, entrata: e, uscita: u });
}

function annullaTurno(k, j) {
  var p = T.persone[k], t = p.turni[j];
  if (!confirm('Annullo il turno di ' + p.nome + ' del ' + t.data + ' (' + t.lavoro + ')?\n\n' +
               'Resta scritto nel foglio delle timbrature come ANNULLATA, ma non conta più.')) return;
  inviaTimbra({ op: 'annulla', righe: t.righe });
}

function nuovoTurno(id, idDip) {
  if (!idDip) idDip = document.getElementById('chiNuovo').value;
  var g = document.getElementById(id + 'g').value, e = document.getElementById(id + 'e').value, u = document.getElementById(id + 'u').value;
  if (!g || !e || !u) return dici('Scrivi giorno, entrata e uscita.', true);
  inviaTimbra({ op: 'nuovo', idDip: idDip, codice: document.getElementById(id + 'c').value, giorno: g, entrata: e, uscita: u });
}


/* ================================================================
   6. DEPOSITO
   ================================================================ */

var ORDINE_STATO = { 'da ricontare': 0, 'finito': 1, 'da ordinare': 2, 'ok': 3 };

function quantoResta(g) {
  if (g.fattore > 1) return esc(quante(g.confezioni, g.acquisto)) + ' <span class="nota">(' + esc(quante(g.pezzi, g.unita)) + ')</span>';
  return num(g.pezzi);
}

function elencoDeposito() {
  if (!DEP) return '<div class="attesa">Carico il deposito…</div>';
  var h = '';

  /* --- quanto resta --- */
  var gl = DEP.giacenze.filter(function (g) { return corrisponde(g.nome); }).slice()
    .sort(function (a, b) { return (ORDINE_STATO[a.stato] - ORDINE_STATO[b.stato]) || (a.nome < b.nome ? -1 : 1); });
  var daOrdinare = DEP.giacenze.filter(function (g) { return g.stato !== 'ok'; }).length;
  h += '<div class="sezione"><h2>Quanto resta</h2><span class="spiega">' +
       (daOrdinare ? '<span class="segnale">' + plurale(daOrdinare, 'prodotto da sistemare', 'prodotti da sistemare') + '</span>, ' : '') +
       'avviso quando mancano meno di ' + DEP.giorniAvviso + ' giorni</span></div>';
  h += '<div class="tabella-scorre"><table><tr><th>Prodotto</th><th class="n">In deposito</th><th class="n colonna-media">Si usa al mese</th>' +
       '<th class="n">Finisce tra</th><th class="colonna-media">Stato</th><th class="n colonna-media">Scorta minima</th></tr>';
  gl.forEach(function (g) {
    var col = { 'ok': 'verde', 'da ordinare': 'ambra', 'finito': 'rosso', 'da ricontare': 'rosso' }[g.stato];
