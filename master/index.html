    h += '<tr><td>' + esc(g.nome) + (g.stato !== 'ok' ? '<br><span class="stato solo-tel ' + col + '">' + esc(g.stato) + '</span>' : '') +
         (g.ultimoArrivo ? '<br><span class="nota">ultimo arrivo ' + esc(g.ultimoArrivo.data) + ', ' + esc(g.ultimoArrivo.chi) + '</span>' : '') + '</td>' +
         '<td class="n">' + quantoResta(g) + '</td>' +
         '<td class="n colonna-media">' + (g.alMese ? (g.fattore > 1 ? esc(quante(g.alMese, g.acquisto)) : num(g.alMese)) : '') + '</td>' +
         '<td class="n">' + (g.giorni === null || g.pezzi <= 0 ? '' : (g.giorni > 365 ? 'oltre un anno' : plurale(g.giorni, 'giorno', 'giorni'))) + '</td>' +
         '<td class="colonna-media"><span class="stato ' + col + '">' + esc(g.stato) + '</span></td>' +
         '<td class="n colonna-media"><input class="cas" type="number" min="0" step="0.5" value="' + (g.scorta === null ? '' : g.scorta) + '" ' +
         'onchange="salvaScorta(\'' + q(esc(g.nome)) + '\', this.value)" aria-label="Scorta minima ' + esc(g.nome) + '"></td></tr>';
  });
  h += '</table></div>';

  /* --- arrivi e conteggi --- */
  h += '<div class="sezione"><h2>Arrivi e conteggi</h2><span class="spiega">le quantità sono come le compri (taniche, cartoni...)</span></div>' +
       '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
       '<button class="bott primo" onclick="apriMovimento(\'Arrivo\')">Registra un arrivo</button>' +
       '<button class="bott" onclick="apriMovimento(\'Conteggio\')">Fai un conteggio</button>' +
       '<button class="bott" onclick="apriMovimento(\'Prodotto\')">Aggiungi un prodotto</button></div>' +
       '<div id="movimento">' + (STATO.moduli.movimento ? moduloMovimento(STATO.moduli.movimento) : '') + '</div>';

  /* --- chi ha preso cosa --- */
  var periodi = [1, 3, 6, 12].map(function (m) {
    return '<option value="' + m + '"' + (m === DEP.mesi ? ' selected' : '') + '>' + (m === 1 ? 'ultimo mese' : 'ultimi ' + m + ' mesi') + '</option>';
  }).join('');
  h += '<div class="sezione"><h2>Chi ha preso cosa</h2><span class="spiega"><select class="cas" style="width:auto" onchange="STATO.mesiDep=Number(this.value);caricaDeposito()">' +
       periodi + '</select> dal ' + esc(DEP.da) + (DEP.media !== null ? ', in media ' + num(DEP.media) + ' pezzi ogni 10 ore' : '') + '</span></div>';
  var pl = DEP.persone.filter(function (p) { return corrisponde(p.nome); });
  if (!pl.length) h += '<div class="vuoto">Nessun prelievo nel periodo.</div>';
  h += pl.map(function (p) {
    var k = DEP.persone.indexOf(p), id = 'd' + k;
    var breve = [plurale(p.volte, 'volta', 'volte')];
    if (p.ore) breve.push(num(p.ore) + ' ore lavorate (' + esc(p.fonte) + ')');
    if (p.ogni10 !== null) breve.push((p.tanto ? '<span class="segnale">' : '') + num(p.ogni10) + ' pezzi ogni 10 ore' + (p.tanto ? ', più della media</span>' : ''));
    return '<div class="riga turnista' + (STATO.aperti[id] ? ' aperta' : '') + '" id="' + id + '">' +
      testaRiga(id, '<span class="nome">' + esc(p.nome) + '</span><br><span class="breve">' + breve.join(', ') + '</span>', '', num(p.pezzi) + ' pezzi') +
      '<div class="aperto-qui"><table>' + p.prodotti.map(function (x) {
        return '<tr><td>' + esc(x.nome) + '</td><td class="n">' + esc(quante(x.pezzi, x.unita)) + '</td></tr>';
      }).join('') + '</table></div></div>';
  }).join('');

  /* --- per lavoro --- */
  h += '<div class="sezione"><h2>Per lavoro</h2><span class="spiega">come l\'hanno indicato i dipendenti</span></div>';
  h += DEP.lavori.filter(function (l) { return corrisponde(l.lavoro); }).map(function (l) {
    var k = DEP.lavori.indexOf(l), id = 'w' + k;
    return '<div class="riga turnista' + (STATO.aperti[id] ? ' aperta' : '') + '" id="' + id + '">' +
      testaRiga(id, '<span class="nome">' + esc(l.lavoro) + '</span><br><span class="breve">' + esc(l.persone.join(', ')) + '</span>', '', num(l.pezzi) + ' pezzi') +
      '<div class="aperto-qui"><table>' + l.prodotti.map(function (x) {
        return '<tr><td>' + esc(x.nome) + '</td><td class="n">' + esc(quante(x.pezzi, x.unita)) + '</td></tr>';
      }).join('') + '</table></div></div>';
  }).join('');

  /* --- ultimi movimenti --- */
  h += '<div class="sezione"><h2>Ultimi movimenti</h2><span class="spiega">si possono togliere quelli sbagliati</span></div>' +
       '<div class="tabella-scorre"><table><tr><th>Data</th><th>Cosa</th><th>Chi</th><th>Prodotti</th><th></th></tr>' +
       DEP.movimenti.filter(function (m) { return corrisponde(m.chi + ' ' + m.righe.map(function (r) { return r.prodotto; }).join(' ')); })
         .slice(0, STATO.tuttiMovimenti ? 60 : 12).map(function (m) {
           return '<tr><td class="num">' + esc(m.data) + '</td><td>' + esc(m.tipo) + '</td><td>' + esc(m.chi) +
                  (m.lavoro ? '<br><span class="nota">' + esc(m.lavoro) + '</span>' : '') + '</td>' +
                  '<td>' + m.righe.map(function (r) { return num(r.q) + ' ' + esc(r.prodotto); }).join(', ') + '</td>' +
                  '<td class="n"><button class="bott rosso" onclick="togliMovimento(\'' + q(esc(m.id)) + '\')">Togli</button></td></tr>';
         }).join('') + '</table></div>' +
       (!STATO.tuttiMovimenti && DEP.movimenti.length > 12
         ? '<button class="bott" style="margin-top:10px" onclick="STATO.tuttiMovimenti=true;disegnaElenco()">Mostra i movimenti più vecchi</button>' : '');
  return h;
}

function apriMovimento(tipo) {
  STATO.moduli.movimento = STATO.moduli.movimento === tipo ? null : tipo;
  document.getElementById('movimento').innerHTML = STATO.moduli.movimento ? moduloMovimento(tipo) : '';
}

function moduloMovimento(tipo) {
  if (tipo === 'Prodotto') {
    return '<div class="modulo">' +
      '<label>Nome<input class="cas" id="npNome" placeholder="Es. Guanti"></label>' +
      '<label>Il dipendente lo prende a<input class="cas" id="npUnita" value="pezzo"></label>' +
      '<label>Tu lo compri a (se diverso)<input class="cas" id="npAcquisto" placeholder="Es. tanica"></label>' +
      '<label>Quanti in uno<input class="cas" id="npFattore" type="number" min="1" step="1" value="1"></label>' +
      '<label>Scorta minima<input class="cas" id="npScorta" type="number" min="0" step="0.5"></label>' +
      '<div><button class="bott primo" onclick="nuovoProdotto()">Aggiungi</button></div></div>';
  }
  var arrivo = tipo === 'Arrivo';
  return '<div class="modulo" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">' +
    (arrivo ? '<label>Fornitore<input class="cas" id="movChi" list="fornitori" placeholder="Es. Felice Palo"></label>' +
              '<datalist id="fornitori">' + DEP.fornitori.map(function (f) { return '<option value="' + esc(f) + '">'; }).join('') + '</datalist>' : '') +
    '<label>Giorno<input class="cas" type="date" id="movData" value="' + DEP.oggi + '" max="' + DEP.oggi + '"></label>' +
    '<label>Note<input class="cas" id="movNote" placeholder="facoltative"></label></div>' +
    '<p class="nota" style="margin:10px 0 4px">' + (arrivo ? 'Scrivi solo i prodotti arrivati.' :
      'Scrivi solo i prodotti che hai contato: da oggi vale quel numero.') + '</p>' +
    '<div class="modulo" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">' +
    DEP.giacenze.map(function (g, i) {
      return '<label>' + esc(g.nome) + ' <span class="nota">(' + esc(g.acquisto) + ')</span>' +
             '<input class="cas" type="number" min="0" step="' + (g.fattore > 1 ? '0.1' : '1') + '" id="mov' + i + '"' +
             (arrivo ? '' : ' placeholder="ora ' + num(g.confezioni) + '"') + '></label>';
    }).join('') +
    '<div><button class="bott primo" onclick="salvaMovimento(\'' + tipo + '\')">' + (arrivo ? 'Registra l\'arrivo' : 'Salva il conteggio') + '</button></div></div>';
}

function salvaMovimento(tipo) {
  var righe = [];
  DEP.giacenze.forEach(function (g, i) {
    var v = document.getElementById('mov' + i).value;
    if (v !== '') righe.push({ prodotto: g.nome, q: v });
  });
  if (!righe.length) return dici('Scrivi almeno una quantità.', true);
  var chi = tipo === 'Arrivo' ? document.getElementById('movChi').value.trim() : '';
  if (tipo === 'Arrivo' && !chi) return dici('Scrivi il fornitore.', true);
  api('master.movimento', { k: CHIAVE, mesi: STATO.mesiDep, tipo: tipo, chi: chi, uid: codiceUnico(),
                            data: document.getElementById('movData').value, note: document.getElementById('movNote').value, righe: righe })
    .then(function (d) { DEP = d; STATO.moduli.movimento = null; disegnaElenco(); dici(tipo === 'Arrivo' ? 'Arrivo registrato.' : 'Conteggio salvato.'); })
    .catch(function (e) { dici(e.message, true); });
}

function togliMovimento(id) {
  if (!confirm('Tolgo questo movimento dal deposito?')) return;
  api('master.togliMovimento', { k: CHIAVE, mesi: STATO.mesiDep, id: id })
    .then(function (d) { DEP = d; disegnaElenco(); dici('Movimento tolto.'); })
    .catch(function (e) { dici(e.message, true); });
}

function salvaScorta(nome, valore) {
  api('master.prodotto', { k: CHIAVE, mesi: STATO.mesiDep, nome: nome, solo: 'scorta', scorta: valore })
    .then(function (d) { DEP = d; disegnaElenco(); dici('Scorta minima di ' + nome + ' salvata.'); })
    .catch(function (e) { dici(e.message, true); });
}

function nuovoProdotto() {
  var g = function (x) { return document.getElementById(x).value.trim(); };
  api('master.prodotto', { k: CHIAVE, mesi: STATO.mesiDep, nome: g('npNome'), unita: g('npUnita'), acquisto: g('npAcquisto'),
                           fattore: g('npFattore'), scorta: g('npScorta') })
    .then(function (d) { DEP = d; STATO.moduli.movimento = null; disegnaElenco(); dici('Prodotto aggiunto.'); })
    .catch(function (e) { dici(e.message, true); });
}


/* ================================================================
   7. LINK PERSONALI
   ================================================================ */

function elencoLink() {
  if (!LNK) return '<div class="attesa">Carico i link…</div>';
  var h = '<div class="sezione"><h2>Link personali</h2><span class="spiega">ognuno contiene i codici di quella persona: mandalo solo a lei</span></div>';
  h += LNK.persone.filter(function (p) { return corrisponde(p.nome); }).map(function (p, i) {
    var parti = [p.pagina === 'interventi' ? 'interventi' : 'ore', p.timbra ? 'timbra' : 'non timbra'];
    if (!p.attivo) parti.unshift('non attivo');
    var testo = 'Ciao ' + p.nome.split(' ')[0] + ', questo è il tuo link personale per l\'app della cooperativa. ' +
                'Aprilo dal telefono e poi aggiungilo alla schermata Home: ' + p.link;
    return '<div class="link-riga"><div><span class="nome">' + esc(p.nome) + '</span><br><span class="breve">' + esc(parti.join(', ')) +
      (p.manca.length ? ', <span class="segnale">manca il codice ' + esc(p.manca.join(' e ')) + '</span>' : '') + '</span></div>' +
      '<input readonly value="' + esc(p.link) + '" onclick="this.select()" aria-label="Link di ' + esc(p.nome) + '">' +
      '<div class="azioni"><button class="bott" onclick="copia(\'' + q(esc(p.link)) + '\')">Copia</button>' +
      '<a class="bott primo" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(testo) + '">WhatsApp</a></div></div>';
  }).join('');
  h += '<p class="nota" style="margin-top:16px">I codici che mancano li crea il comando "Crea i link personali" del foglio Gestione ore.</p>';
  return h;
}

function copia(testo) {
  var fatto = function () { dici('Link copiato.'); };
  if (navigator.clipboard) navigator.clipboard.writeText(testo).then(fatto, function () { prompt('Copia il link:', testo); });
  else prompt('Copia il link:', testo);
}


/* ================================================================
   AVVIO
   ================================================================ */

if (!CHIAVE) {
  document.getElementById('frase').innerHTML = '';
  document.getElementById('elenco').innerHTML = '<div class="errore">Apri il link master che ti ha dato chi gestisce il foglio.</div>';
} else {
  if (location.search.indexOf('k=') < 0) history.replaceState(null, '', RADICE + 'master/?k=' + encodeURIComponent(CHIAVE));
  manifestMaster();
  caricaMese(null);
}
</script>
